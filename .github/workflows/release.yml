name: Release

# Dispatch from main. Application source comes from the selected edition;
# the shared installer always comes from main.
on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Interface to publish"
        type: choice
        options: [native-ui, web-ui, both]
        default: native-ui
        required: true
      bump:
        description: "Version step: auto reads the commits (feat: minor, fix: patch, type!: or BREAKING CHANGE: major)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
        required: true
      notes:
        description: "Release notes (optional)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      editions: ${{ steps.matrix.outputs.editions }}
    steps:
      - id: matrix
        env:
          EDITION: ${{ inputs.edition }}
        run: |
          case "$EDITION" in
            both) echo 'editions=["native-ui","web-ui"]' >> "$GITHUB_OUTPUT" ;;
            native-ui|web-ui) echo "editions=[\"$EDITION\"]" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

  release:
    needs: select
    name: Publish ${{ matrix.edition }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.select.outputs.editions) }}
    concurrency:
      group: release-${{ matrix.edition }}
      cancel-in-progress: false
    steps:
      - name: Checkout the selected source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.edition }}
          fetch-depth: 0

      - name: Verify edition and compute its next version
        id: v
        shell: pwsh
        env:
          EDITION: ${{ matrix.edition }}
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          if ((Get-Content EDITION -Raw).Trim() -ne $env:EDITION) { throw 'Source edition mismatch' }
          # Reserve versions used by any tag, including failed/draft attempts.
          $tags = @(git tag --list "v*-$env:EDITION")
          # the commits since this edition's latest release decide the step (semantic versioning)
          $last = $tags | Where-Object { $_ -match '^v\d+\.\d+\.\d+-' } |
            Sort-Object { [version]($_ -replace '^v|-.*$', '') } -Descending | Select-Object -First 1
          $commits = @()
          if ($last) { $commits = @((git log "$last..HEAD" --format='%s%n%b%x1e') -join "`n" -split [char]0x1e) }
          $ver = & ./tools/release-version.ps1 -Edition $env:EDITION -BaseVersion (Get-Content VERSION -Raw).Trim() -Tags $tags -Commits $commits -Bump $env:BUMP
          Write-Host "Last release: $last, step: $env:BUMP -> $ver"
          $sha = git rev-parse HEAD
          Set-Content VERSION $ver -NoNewline -Encoding ascii
          "ver=$ver" >> $env:GITHUB_OUTPUT
          "tag=v$ver-$env:EDITION" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT


      - uses: dtolnay/rust-toolchain@nightly
      - name: Check application-independent overlay policy
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force build/tests | Out-Null
          rustc --edition 2021 --test tools/dev/window-policy-tests.rs -o build/tests/window-policy-tests.exe
          if ($LASTEXITCODE) { throw 'Window policy tests did not compile' }
          ./build/tests/window-policy-tests.exe
          if ($LASTEXITCODE) { throw 'Window policy regression failed' }
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.edition }}
          workspaces: |
            tiling
            shell
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout the shared installer from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: shared-installer
          sparse-checkout: installer/setup.ps1
          sparse-checkout-cone-mode: false

      - name: Put the shared installer into the edition package
        shell: pwsh
        run: |
          if (-not (Test-Path shared-installer/installer/setup.ps1)) { throw 'Shared installer missing on main' }
          New-Item -ItemType Directory -Force installer | Out-Null
          Copy-Item shared-installer/installer/setup.ps1 installer/setup.ps1 -Force

      - name: Build package
        shell: pwsh
        env:
          EDITION: ${{ matrix.edition }}
        run: ./build.ps1 -Edition $env:EDITION

      - name: Check theme, media and core regressions
        shell: powershell
        run: |
          node ./tools/dev/theme-tests.mjs
          if ($LASTEXITCODE) { throw 'Theme regression failed' }
          node ./tools/dev/bar-data-tests.mjs
          if ($LASTEXITCODE) { throw 'Bar data regression failed' }
          ./tools/dev/core-tests.ps1

      - name: Publish this edition
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ steps.v.outputs.sha }}
          name: Logical Lunge ${{ matrix.edition }} v${{ steps.v.outputs.ver }}
          body: ${{ inputs.notes }}
          files: |
            dist/LogicalLunge-${{ matrix.edition }}-${{ steps.v.outputs.ver }}.zip
            dist/LogicalLunge-${{ matrix.edition }}-${{ steps.v.outputs.ver }}.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          make_latest: "false"

