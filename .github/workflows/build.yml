name: Build

# Builds and tests an edition from any branch without publishing anything: the
# package is kept as a workflow artifact (install it with LL_SOURCE). Same steps
# as the Release workflow up to the package and its regression checks.
on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Interface to build"
        type: choice
        options: [native-ui, web-ui]
        default: native-ui
        required: true
      ref:
        description: "Branch or commit to build (empty: the edition branch)"
        type: string
        default: ""
      trace_threadpool:
        description: "Diagnostics instead of the stress checks: trace who makes the window manager's thread pool grow over the window churn"
        type: boolean
        default: false
      trace:
        description: "Record an ETW trace of the stress test's load phase and analyse long slide frames (not with trace_threadpool)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.edition }} (${{ inputs.ref || inputs.edition }})
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.edition }}
          fetch-depth: 0

      - name: Verify edition and compute the version a release would get
        id: v
        shell: pwsh
        env:
          EDITION: ${{ inputs.edition }}
        run: |
          if ((Get-Content EDITION -Raw).Trim() -ne $env:EDITION) { throw 'Source edition mismatch' }
          $tags = @(git tag --list "v*-$env:EDITION")
          $ver = & ./tools/release-version.ps1 -Edition $env:EDITION -BaseVersion (Get-Content VERSION -Raw).Trim() -Tags $tags
          Set-Content VERSION $ver -NoNewline -Encoding ascii
          "ver=$ver" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@nightly
      - name: Check application-independent overlay policy
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force build/tests | Out-Null
          rustc --edition 2021 --test tools/dev/window-policy-tests.rs -o build/tests/window-policy-tests.exe
          if ($LASTEXITCODE) { throw 'Window policy tests did not compile' }
          ./build/tests/window-policy-tests.exe
          if ($LASTEXITCODE) { throw 'Window policy regression failed' }
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ inputs.edition }}
          workspaces: |
            tiling
            shell
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout the shared installer from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: shared-installer
          sparse-checkout: installer/setup.ps1
          sparse-checkout-cone-mode: false

      - name: Put the shared installer into the edition package
        shell: pwsh
        run: |
          if (-not (Test-Path shared-installer/installer/setup.ps1)) { throw 'Shared installer missing on main' }
          New-Item -ItemType Directory -Force installer | Out-Null
          Copy-Item shared-installer/installer/setup.ps1 installer/setup.ps1 -Force

      - name: Build package
        shell: pwsh
        env:
          EDITION: ${{ inputs.edition }}
        run: ./build.ps1 -Edition $env:EDITION

      - name: Keep the window manager's symbols (thread pool trace)
        if: inputs.trace_threadpool
        uses: actions/upload-artifact@v4
        with:
          name: tiling-pdb-${{ inputs.edition }}
          path: tiling/target/release/*.pdb
          if-no-files-found: warn
          retention-days: 3

      - name: Run the shell's unit tests
        shell: pwsh
        working-directory: shell
        run: |
          cargo test --release -p lunge-shell -p lunge-wallpaper -p systray-util
          if ($LASTEXITCODE) { throw 'Shell unit tests failed' }

      - name: Run the window manager's event and window sync tests
        shell: pwsh
        working-directory: tiling
        run: |
          cargo test --release -p wm -- events::handle_window_moved_or_resized commands::general::window_sync_policy wm_state::adjacent_tests commands::container::split_ratio commands::workspace::focus_workspace dwindle_math user_config::tests::window_border commands::window::floating_placement stall_watch event_coalesce correction_budget
          if ($LASTEXITCODE) { throw 'Window manager event tests failed' }

      - name: Check theme, media and core regressions
        shell: powershell
        run: |
          # the web widgets' JavaScript tests (only the web edition has them)
          if (Test-Path ./tools/dev/theme-tests.mjs) {
            node ./tools/dev/theme-tests.mjs
            if ($LASTEXITCODE) { throw 'Theme regression failed' }
          }
          if (Test-Path ./tools/dev/bar-data-tests.mjs) {
            node ./tools/dev/bar-data-tests.mjs
            if ($LASTEXITCODE) { throw 'Bar data regression failed' }
          }
          # every text the native shell translates has a row in ui/i18n.json
          if (Test-Path ./tools/dev/i18n-coverage.mjs) {
            node ./tools/dev/i18n-coverage.mjs
            if ($LASTEXITCODE) { throw 'Untranslated shell texts' }
          }
          ./tools/dev/core-tests.ps1
          # the uninstall's process stop, restore and deletion guards, with every system boundary faked
          if (Test-Path ./tools/dev/uninstall-tests.ps1) { ./tools/dev/uninstall-tests.ps1 }

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: LogicalLunge-${{ inputs.edition }}-${{ steps.v.outputs.ver }}-build
          path: |
            dist/LogicalLunge-${{ inputs.edition }}-${{ steps.v.outputs.ver }}.zip
            dist/LogicalLunge-${{ inputs.edition }}-${{ steps.v.outputs.ver }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  # Runs the package's desktop (core, window manager, shell) for several minutes idle and then with every CPU busy and
  # memory under pressure, and fails on a restart, crash, silent bar, slow or dropped input hook, long frames or growing
  # handles/GDI/memory (tools/ci/stress-test.ps1 on main holds the limits). A regression like a watchdog restarting a
  # healthy shell cannot reach a release past this.
  stress:
    name: Stress ${{ inputs.edition }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout the stress test from main
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tools/ci
          sparse-checkout-cone-mode: false

      - name: Fetch the package
        uses: actions/download-artifact@v4
        with:
          pattern: LogicalLunge-${{ inputs.edition }}-*-build
          path: pkg
          merge-multiple: true

      - name: Unpack it
        shell: pwsh
        run: |
          $zip = Get-ChildItem pkg -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw 'No package artifact' }
          Expand-Archive $zip.FullName -DestinationPath unpacked -Force

      - name: Fetch the window manager's symbols (thread pool trace)
        if: inputs.trace_threadpool
        uses: actions/download-artifact@v4
        with:
          name: tiling-pdb-${{ inputs.edition }}
          path: tiling-pdb

      - name: Run the desktop under load
        shell: pwsh
        env:
          LL_TRACE_THREADPOOL: ${{ inputs.trace_threadpool && '1' || '' }}
          LL_STRESS_TRACE: ${{ inputs.trace && '1' || '' }}
        run: ./tools/ci/stress-test.ps1 -Package unpacked

      # windows that never accept their place (a minimum size bigger than any tile, one resizing itself back, a
      # location and a title event storm): the window manager must stay responsive and light (refusing-windows-test.ps1)
      - name: Run the window manager against windows that refuse their place
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tools/ci/refusing-windows-test.ps1 -Package unpacked

      - name: Keep the thread pool trace
        if: inputs.trace_threadpool && always()
        uses: actions/upload-artifact@v4
        with:
          name: threadpool-trace-${{ inputs.edition }}
          path: threadpool-trace-out
          if-no-files-found: warn
          retention-days: 3

      # trace input only: where the long frames of the load phase went (tools/ci/trace-analysis)
      - name: Analyse the load trace
        if: always() && inputs.trace
        shell: pwsh
        env:
          _NT_SYMBOL_PATH: srv*${{ runner.temp }}\symbols*https://msdl.microsoft.com/download/symbols
        run: |
          $etl = Join-Path ([IO.Path]::GetTempPath()) 'stress-load.etl'
          if (-not (Test-Path $etl)) { Write-Host 'no trace'; exit 0 }
          New-Item -ItemType Directory -Force trace-out | Out-Null
          Copy-Item $etl trace-out/
          dotnet run --project tools/ci/trace-analysis -c Release -- $etl 100 8 | Tee-Object trace-out/analysis.txt
          "### Load trace: long waits of the core on DWM" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content trace-out/analysis.txt -TotalCount 120 >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Keep the load trace
        if: always() && inputs.trace
        uses: actions/upload-artifact@v4
        with:
          name: stress-trace-${{ inputs.edition }}
          path: trace-out
          if-no-files-found: warn
          retention-days: 7

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-logs-${{ inputs.edition }}
          path: ~/AppData/Local/LogicalLunge/logs
          if-no-files-found: warn
          retention-days: 7

  # Installs the package, runs its desktop, hangs the window manager (the core's watchdog then restarts it) and
  # uninstalls right then: the uninstall must finish ("done"), leave no process of the install folder (none may come
  # back either) and remove the folder (tools/ci/uninstall-test.ps1 on main).
  uninstall:
    name: Uninstall ${{ inputs.edition }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the uninstall test from main
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tools/ci
          sparse-checkout-cone-mode: false

      - name: Fetch the package
        uses: actions/download-artifact@v4
        with:
          pattern: LogicalLunge-${{ inputs.edition }}-*-build
          path: pkg
          merge-multiple: true

      - name: Unpack it
        shell: pwsh
        run: |
          $zip = Get-ChildItem pkg -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw 'No package artifact' }
          Expand-Archive $zip.FullName -DestinationPath unpacked -Force

      - name: Install, hang the window manager and uninstall
        shell: powershell
        run: ./tools/ci/uninstall-test.ps1 -Package unpacked

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uninstall-logs-${{ inputs.edition }}
          path: |
            ~/AppData/Local/LogicalLunge/logs
            ~/AppData/Local/Temp/logical-lunge-install.log
          if-no-files-found: warn
          retention-days: 7
