[package]
name = "lunge-shell"
version = "0.0.0"
description = "Logical Lunge shell: the native bar, Super menu, panels, notification cards and desktop widgets."
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
# the exe's icon and manifest (Windows resource script, compiled by the SDK's rc.exe)
embed-resource = "3"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
crossbeam = "0.8"
netdev = "0.33"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starship-battery = "0.8"
sysinfo = "0.30"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
# colours from the wallpaper (Material Color Utilities: quantize, score, schemes)
material-colors = { version = "0.5", features = ["quantize"] }

[target.'cfg(target_os = "windows")'.dependencies]
systray-util = { path = "../../crates/systray-util" }
windows-core = { workspace = true }
# Urlmon: a notification card's image from the web (through the Windows cache);
# WinHttp: the issue report's upload
windows = { workspace = true, features = ["Win32_System_Com_Urlmon", "Win32_Networking_WinHttp", "Win32_UI_Shell_Common", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation"] }
