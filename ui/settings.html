<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <script>
// Logical Lunge dil katmanı: arayüz Türkçe yazılır; sistem dili Türkçe değilse ekrandaki metinler,
// title ve placeholder'lar i18n.json'dan çevrilir (13 dil; olmayan dil İngilizceye düşer, Arapça sağdan sola).
// Tarih/ay/gün adları window.LL_LOCALE ile (Intl) aynı dilde. Yeni dil / metin: i18n.src.js.
// Kurulumda seçilen dil ve saat prefs.json'da ({"language": "system" | "tr" | "en" ..., "clock": "24" | "12"}):
// dil "system" değilse sistem dilinin yerine geçer; window.LL_HOUR12 saatlerin 12 saatlik (AM/PM) çizilmesi içindir.
(function () {
  var prefs = {};
  try {
    var px = new XMLHttpRequest(); px.open('GET', './prefs.json', false); px.send();
    if (px.status === 200) prefs = JSON.parse(px.responseText) || {};
  } catch (e) {}
  window.LL_PREFS = prefs;
  window.LL_HOUR12 = prefs.clock === '12';
  var lang = prefs.language && prefs.language !== 'system' ? prefs.language
    : (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
  window.LL_LOCALE = lang;
  var code = lang.slice(0, 2).toLowerCase();
  window.LL_T = function (s) { return s; };
  if (code === 'tr') return;
  var data = null;
  try {
    // Sayfa çizilmeden önce hazır olsun diye eşzamanlı (yerel kabuk sunucusundan, ~1 ms)
    var x = new XMLHttpRequest(); x.open('GET', './i18n.json', false); x.send();
    if (x.status === 200) data = JSON.parse(x.responseText);
  } catch (e) {}
  if (!data) return;
  if (data.langs.indexOf(code) < 0) code = 'en';
  if (code === 'ar') document.documentElement.dir = 'rtl';
  document.documentElement.lang = code;
  var vals = data[code], dict = {}, pats = [];
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  data.keys.forEach(function (k, i) {
    if (/\$\d/.test(k)) {
      // "$1 zaten "$2" için..." -> (.+?) grupları; hangi grubun $kaç olduğunu sırayla tut
      var order = (k.match(/\$\d/g) || []).map(function (x) { return +x.charAt(1); });
      pats.push([new RegExp('^' + esc(k).replace(/\\\$\d/g, '(.+?)') + '$'), vals[i], order]);
    }
    else dict[k] = vals[i];
  });
  // Başı sabit metinle başlayan desenler önce: "Açık · 20:00 sonrası" -> Açık · (20:00 sonrası)
  pats.sort(function (a, b) { return (a[0].source.indexOf('^(') === 0) - (b[0].source.indexOf('^(') === 0); });
  function T(s) {
    if (!s) return s;
    var k = s.trim();
    if (!k || !/[A-Za-zÇĞİÖŞÜçğıöşü]/.test(k)) return s;
    var v = dict[k];
    if (v === undefined) {
      for (var i = 0; i < pats.length; i++) {
        var m = k.match(pats[i][0]);
        if (m) {
          v = pats[i][1];
          for (var j = 0; j < pats[i][2].length; j++) v = v.replace('$' + pats[i][2][j], T(m[j + 1])); // iç içe: "Açık · 20:00 sonrası"
          break;
        }
      }
    }
    return v === undefined ? s : s.replace(k, v);
  }
  window.LL_T = T;
  function fixNode(n) {
    if (n.nodeType === 3) { var t = T(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; return; }
    if (n.nodeType !== 1) return;
    if (n.classList && n.classList.contains('icon')) return; // ikon adları (Material Symbols ligatürleri)
    ['title', 'placeholder', 'aria-label'].forEach(function (a) {
      var v = n.getAttribute && n.getAttribute(a);
      if (v) { var t = T(v); if (t !== v) n.setAttribute(a, t); }
    });
    for (var c = n.firstChild; c; c = c.nextSibling) fixNode(c);
  }
  new MutationObserver(function (list) {
    for (var i = 0; i < list.length; i++) {
      var m = list[i];
      if (m.type === 'characterData') {
        var p = m.target.parentNode;
        if (!(p && p.classList && p.classList.contains('icon'))) fixNode(m.target);
      } else if (m.type === 'attributes') fixNode(m.target);
      else for (var j = 0; j < m.addedNodes.length; j++) {
        var a = m.addedNodes[j], par = a.parentNode;
        if (a.nodeType === 3 && par && par.classList && par.classList.contains('icon')) continue;
        fixNode(a);
      }
    }
  }).observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['title', 'placeholder', 'aria-label'] });
})();
    </script>
    <script>
// Logical Lunge kabuk teması (ii'deki karanlık/aydınlık düğmesi). Windows temasına dokunmaz.
// Tek kaynak çekirdekteki prefs.json "theme" anahtarı (native bar da onu okur). localStorage 'll.theme' onun sayfa
// çizilmeden okunabilen kopyası: bir widget değiştirince diğerleri 'storage' olayıyla anında güncellenir; başka yerden
// gelen değişikliği (native bar, ayarlar) bildirim widget'ı çekirdeğin olay akışından alıp llTheme.set ile buraya yazar.
(function () {
  function read() {
    try { return localStorage.getItem('ll.theme') === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; }
  }
  function write(t) { try { localStorage.setItem('ll.theme', t); } catch (e) {} }
  function apply() { document.documentElement.dataset.theme = read(); }
  function save(t) {
    try { var x = new XMLHttpRequest(); x.open('POST', 'http://127.0.0.1:6131/pref?k=theme&v=' + t); x.send(); } catch (e) {}
  }
  var P = window.LL_PREFS || {};
  if (P.theme === 'light' || P.theme === 'dark') write(P.theme);
  else if (read() === 'light') save('light'); // eski sürümden: tercih yalnızca bu tarayıcı deposundaydı
  apply();
  window.addEventListener('storage', function (e) { if (e.key === 'll.theme') apply(); });
  window.llTheme = {
    get: read,
    // Başka yerden gelen değişiklik (kaydedilmez, zaten kayıtlı)
    set: function (t) { if (t === 'light' || t === 'dark') { write(t); apply(); } return read(); },
    toggle: function () {
      var next = read() === 'light' ? 'dark' : 'light';
      write(next);
      apply();
      save(next);
      return next;
    }
  };
})();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./settings.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Logical Lunge ayarlar penceresi: sağ paneldeki dişliyle ekranın ortasında açılır (ll:settings-toggle).
      // Görünüm (tema, odak rengi, animasyonlar), dil ve saat, kısayollar, gece ışığı, sistem sağlığı, gelişmiş, hakkında.
      // Değişiklikleri çekirdek yapar (lunge.exe --set-focus-color / --set-pref / ...); dil ve saat gibi arayüz tercihleri
      // kabuk yeniden açılınca uygulanır.
      import React, { useState, useEffect, useRef, useCallback } from 'react';
      import { applyAccent } from 'lunge/theme';
      import { createRoot } from 'react-dom/client';
      import * as lunge from 'lunge/shell';
      import { listen, emit } from '@tauri-apps/api/event';
      import { UI_SCALES, saveUiScale } from '../parity-sidebar.mjs';

      const win = lunge.currentWidget().tauriWindow;
      const HELPER = '{{INSTALL_ESC}}\\lunge.exe';
      const helper = args => lunge.shellExec(HELPER, args).then(r => (r.stdout || '').trim());
      const json = s => { try { return JSON.parse(s); } catch { return null; } };
      const Icon = ({ name, fill, style }) => <span className={`icon ${fill ? 'fill' : ''}`} style={style}>{name}</span>;

      const COLORS = [['Mor', '#b69df8'], ['Mavi', '#8ab4f8'], ['Camgöbeği', '#7fd4c9'], ['Yeşil', '#a6d189'], ['Pembe', '#f5a3c7'], ['Turuncu', '#ffb77c'], ['Kırmızı', '#f28b82']];
      const LANGS = [['system', 'Sistem dili'], ['tr', 'Türkçe'], ['en', 'English'], ['de', 'Deutsch'], ['fr', 'Français'], ['es', 'Español'], ['it', 'Italiano'], ['pt', 'Português'],
        ['ru', 'Русский'], ['uk', 'Українська'], ['pl', 'Polski'], ['ja', '日本語'], ['zh', '中文'], ['ko', '한국어'], ['ar', 'العربية']];
      const SECTIONS = [['look', 'palette', 'Görünüm'], ['workspaces', 'grid_view', 'Workspace'], ['lang', 'translate', 'Dil ve saat'], ['keys', 'keyboard', 'Kısayollar'], ['night', 'nightlight', 'Gece ışığı'],
        ['health', 'monitor_heart', 'Sistem sağlığı'], ['adv', 'tune', 'Gelişmiş'], ['about', 'info', 'Hakkında']];

      function formatUptime(sec) {
        if (sec == null) return '—';
        const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
        return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
      }

      function Switch({ on, onChange }) {
        return <button className={`switch ${on ? 'on' : ''}`} onClick={() => onChange(!on)} aria-label="Aç / kapat"><span /></button>;
      }
      function Seg({ items, value, onChange }) {
        return (
          <div className="seg">
            {items.map(([k, label, icon]) => (
              <button key={k} className={value === k ? 'sel' : ''} onClick={() => onChange(k)}>{icon && <Icon name={icon} />}{label}</button>
            ))}
          </div>
        );
      }
      function Row({ icon, label, sub, children, onClick }) {
        return (
          <div className={`row ${onClick ? 'click' : ''}`} onClick={onClick}>
            {icon && <Icon name={icon} />}
            <div className="txt"><span className="lbl">{label}</span>{sub && <span className="sub">{sub}</span>}</div>
            {children}
          </div>
        );
      }

      // ---------------------------------------------------------------- Workspace
        function WorkspacesPage({ s, update }) {
          const [mode, setMode] = useState('divider');
          const ws = s.workspaces || [];
          const [wsCount, setWsCount] = useState(30);
          useEffect(() => { if (ws.length) setWsCount(ws.length); }, [ws.length]);
          const [firstWorkspace, setFirstWorkspace] = useState(1);
          useEffect(() => { if (ws.length) setFirstWorkspace(Number(ws[0].name)); }, [ws[0]?.name]);
          const orderedWs = [...ws].sort((a, b) =>
            ((Number(a.name) - firstWorkspace + ws.length) % ws.length) -
            ((Number(b.name) - firstWorkspace + ws.length) % ws.length));
          const previewHead = orderedWs.length > 14 ? orderedWs.slice(0, 10) : orderedWs;
          const previewTail = orderedWs.length > 14 ? orderedWs.slice(-2) : [];
          const hiddenCount = orderedWs.length - previewHead.length - previewTail.length;

          const mons = Array.isArray(s.monitors) ? s.monitors : [];
          const numMons = mons.length;
          const legacyBindings = numMons > 0 && ws.length > 0 &&
            ws.every(w => Number.isInteger(w.bind_to_monitor) && w.bind_to_monitor >= 1 && w.bind_to_monitor <= numMons) &&
            ws.some(w => w.bind_to_monitor === numMons);

          const [dividers, setDividers] = useState([]);
          const [segMon, setSegMon] = useState([]);
          const [saved, setSaved] = useState(false);
          const [busy, setBusy] = useState(false);
          const [error, setError] = useState('');
          const [dragging, setDragging] = useState(null);
          const [hoverPct, setHoverPct] = useState(null);
          const [customMap, setCustomMap] = useState({});
          const layoutKey = ws.map(w => `${w.name}:${w.bind_to_monitor}`).join('|') + '/' + mons.map(m => m.index).join('|');
          useEffect(() => {
            if (!ws.length || !mons.length) return;
            const valid = new Set(mons.map(m => m.index));
            const map = Object.fromEntries(ws.map(w => [w.name, legacyBindings ? w.bind_to_monitor - 1 :
              valid.has(w.bind_to_monitor) ? w.bind_to_monitor : mons[0].index]));
            setCustomMap(map);
            const boundaries = [];
            const order = [map[ws[0].name]];
            for (let i = 1; i < ws.length; i++) if (map[ws[i].name] !== map[ws[i - 1].name]) {
              boundaries.push(i); order.push(map[ws[i].name]);
            }
            if (boundaries.length === mons.length - 1 && new Set(order).size === mons.length) {
              setDividers(boundaries); setSegMon(order);
            } else {
              setDividers(mons.slice(1).map((_, i) => Math.max(1, Math.floor(ws.length * (i + 1) / mons.length))));
              setSegMon(mons.map(m => m.index));
            }
          }, [layoutKey]);

          const saveMap = async (map, count = null, first = firstWorkspace) => {
            if (busy) return;
            setBusy(true); setError(''); setSaved(false);
            try {
              const args = ['--set-workspaces'];
              if (count !== null) args.push('count:' + count);
              args.push('first:' + first);
              Object.entries(map || {}).forEach(([k, v]) => { if (Number(k) <= (count ?? ws.length)) args.push(k + ':' + v); });
              const result = json(await helper(args));
              if (!result?.ok) throw new Error(result?.error || 'Değişiklik uygulanamadı.');
              const fresh = json(await helper(['--settings-get']));
              if (!fresh?.workspaces) throw new Error('Yeni ayar okunamadı.');
              update({ workspaces: fresh.workspaces, monitors: fresh.monitors });
              if (map) setCustomMap(map);
              setSaved(true);
              setTimeout(() => setSaved(false), 2500);
            } catch (e) { setError(e.message || 'Değişiklik uygulanamadı.'); }
            finally { setBusy(false); }
          };

          const saveCount = () => {
            const count = Math.min(100, Math.max(numMons, Number(wsCount) || ws.length));
            if (!Number.isInteger(count)) { setError('Geçerli bir sayı girin.'); return; }
            saveMap(null, count, firstWorkspace <= count ? firstWorkspace : 1);
          };

          const applyDivider = () => {
            let map = {};
            orderedWs.forEach((w, i) => {
              let seg = 0;
              while (seg < dividers.length && i >= dividers[seg]) seg++;
              map[w.name] = segMon[seg] ?? mons[seg]?.index;
            });
            saveMap(map);
          };

          // --- Number line ---
          const lineRef = useRef(null);
          const total = ws.length;

          const getRect = () => lineRef.current ? lineRef.current.getBoundingClientRect() : null;
          const toPercent = val => total ? val / total * 100 : 0;

          const fromClientX = (clientX) => {
            const rect = getRect();
            if (!rect) return 0;
            const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            return Math.round(pct * total);
          };

          const onPointerDown = (e, idx) => {
            e.preventDefault();
            e.currentTarget.setPointerCapture(e.pointerId);
            setDragging(idx);
          };
          const onPointerMove = (e) => {
            const rect = getRect();
            if (!rect) return;
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            if (e.pointerType === 'mouse' || e.pointerType === 'pen') setHoverPct(pct);

            if (dragging !== null) {
              const val = fromClientX(e.clientX);
              const minV = dragging > 0 ? dividers[dragging - 1] + 1 : 1;
              const maxV = dragging < dividers.length - 1 ? dividers[dragging + 1] - 1 : total - 1;
              const clamped = Math.max(minV, Math.min(maxV, val));
              if (clamped !== dividers[dragging]) {
                const d = [...dividers];
                d[dragging] = clamped;
                setDividers(d);
              }
            }
          };
          const onPointerUp = () => { setDragging(null); setHoverPct(null); };
          const onPointerLeave = () => { if (dragging === null) setHoverPct(null); };

          const segColors = ['var(--m3primary)', '#4fc3f7', '#81c784', '#ffb74d', '#e57373', '#ba68c8'];

          const segments = Array.from({length: numMons}).map((_, seg) => {
            const start = seg === 0 ? 0 : dividers[seg - 1];
            const end = seg === numMons - 1 ? total : dividers[seg];
            return { start, end, count: end - start };
          });
          const lensIndex = hoverPct === null ? null : Math.max(1, Math.min(total, Math.round(hoverPct * total)));
          const lensWidth = getRect()?.width || 500;
          const lensLeft = Math.max(Math.min(110, lensWidth / 2), Math.min(lensWidth - Math.min(110, lensWidth / 2), (hoverPct || 0) * lensWidth));

          // Smart label visibility: only show labels that won't overlap
          const buildLabels = () => {
            const rect = getRect();
            const containerW = rect ? rect.width : 500;
            const minGap = 28; // minimum pixels between label centers
            const labels = [];
            // Always show 1 and total
            // Then show divider values, then multiples of 5, then fill near hover
            const candidates = new Set();
            candidates.add(1);
            candidates.add(total);
            dividers.forEach(d => candidates.add(d));
            for (let t = 5; t < total; t += 5) candidates.add(t);
            // Sort and filter by minimum pixel distance
            const sorted = [...candidates].sort((a, b) => a - b);
            let lastPx = -Infinity;
            for (const val of sorted) {
              const px = (toPercent(val) / 100) * containerW;
              if (px - lastPx >= minGap || val === 1 || val === total) {
                // Check that 1 and total don't clash with neighbors
                if ((val === 1 || val === total) && Math.abs(px - lastPx) < minGap / 2 && labels.length > 0) continue;
                labels.push(val);
                lastPx = px;
              }
            }
            return labels;
          };

          if (!total || !numMons) return <div className="card ws-empty">{s.workspaceError || 'Çalışma alanları veya monitörler okunamadı. Pencere yöneticisini kontrol edin.'}</div>;

          return (
            <>
              <div className="sec-title">Genel</div>
              <div className="card">
                <Row icon="grid_view" label="Çalışma alanı sayısı" sub={`${ws.length} alan tanımlı; en az ${numMons} olmalı.`}>
                  <div className="ws-count">
                    <button type="button" aria-label="Bir azalt" disabled={busy || wsCount <= numMons} onClick={() => setWsCount(x => Math.max(numMons, Number(x) - 1))}>−</button>
                    <input type="number" min={numMons} max="100" value={wsCount} aria-label="Çalışma alanı sayısı" onChange={e => setWsCount(e.target.value)} />
                    <button type="button" aria-label="Bir artır" disabled={busy || wsCount >= 100} onClick={() => setWsCount(x => Math.min(100, Number(x) + 1))}>+</button>
                  </div>
                  <button className="btn tonal" disabled={busy || Number(wsCount) === ws.length} onClick={saveCount}>Kaydet</button>
                </Row>
                <Row icon="first_page" label="İlk sıradaki çalışma alanı" sub="Sıra buradan başlar; alanların adları değişmez.">
                  <div className="ws-count ws-start">
                    <button type="button" aria-label="Başlangıç alanını azalt" disabled={busy || firstWorkspace <= 1} onClick={() => setFirstWorkspace(x => Math.max(1, x - 1))}>−</button>
                    <input type="number" min="1" max={total} value={firstWorkspace} aria-label="İlk sıradaki çalışma alanı" onFocus={e => e.target.select()} onChange={e => setFirstWorkspace(Math.min(total, Math.max(1, Number(e.target.value) || 1)))} />
                    <button type="button" aria-label="Başlangıç alanını artır" disabled={busy || firstWorkspace >= total} onClick={() => setFirstWorkspace(x => Math.min(total, x + 1))}>+</button>
                  </div>
                  <button className="btn tonal" disabled={busy || firstWorkspace === Number(ws[0]?.name)} onClick={() => saveMap(null)}>Sırayı kaydet</button>
                </Row>
              </div>
              <div className="ws-order" aria-label="Çalışma alanı sırası">
                <span>Sıra önizlemesi</span>
                <div>{previewHead.map(w => <b key={w.name}>{w.name}</b>)}{hiddenCount > 0 && <em>+{hiddenCount}</em>}{previewTail.map(w => <b key={w.name}>{w.name}</b>)}</div>
              </div>
              {error && <div className="note ws-error" role="alert"><Icon name="error" />{error}</div>}
              {saved && <div className="note ws-saved" role="status"><Icon name="check_circle" />Kaydedildi</div>}

              <div className="sec-title">Çoklu Monitör Desteği</div>
              <div className="card">
                <Row icon="desktop_windows" label="Bağlı monitörler" sub={mons.map(m => `${m.name} · ${m.w}×${m.h}`).join(' · ') || 'Bilgi alınamadı'}>
                  <span style={{ opacity: 0.6, fontSize: '0.85em', fontWeight: 600 }}>{numMons}</span>
                </Row>
                <Row icon="splitscreen" label="Dağıtım şekli" sub="Çalışma alanlarını monitörlere nasıl dağıtacağınızı seçin">
                  <Seg items={[['divider', 'Aralıklar', 'align_vertical_center'], ['custom', 'Tek tek', 'touch_app']]} value={mode} onChange={setMode} />
                </Row>
              </div>
              {legacyBindings && <div className="note"><Icon name="info" />Eski monitör numaraları bulundu. Dağılımı kaydettiğinde geçerli monitör indekslerine dönüştürülecek.</div>}

              {mode === 'divider' && (
                <>
                  <div className="sec-title">Dağılım Çizelgesi</div>
                  <div className="card">
                    <div style={{ padding: '20px' }}>
                      <div className="sub" style={{ marginBottom: '16px' }}>
                        Ayraçları sürükleyerek sıralı çalışma alanlarını monitörlere bölün.
                      </div>

                      {/* === Number line === */}
                      <div ref={lineRef}
                        style={{ position: 'relative', height: '52px', userSelect: 'none', touchAction: 'none', cursor: 'default', marginTop: '38px', marginBottom: '4px' }}
                        onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerLeave={onPointerLeave}>

                        {lensIndex !== null && <div className="ws-lens" style={{ left: lensLeft }} aria-hidden="true">
                          {[-2, -1, 0, 1, 2].map(offset => {
                            const item = orderedWs[lensIndex - 1 + offset];
                            return <span key={offset} className={offset === 0 ? 'center' : Math.abs(offset) === 1 ? 'near' : ''}>{item?.name ?? '·'}</span>;
                          })}
                        </div>}

                        {/* Track background */}
                        <div style={{ position: 'absolute', top: '14px', left: 0, right: 0, height: '10px', borderRadius: '5px', background: 'rgba(255,255,255,0.06)' }} />

                        {/* Colored segment fills */}
                        {segments.map((seg, i) => {
                          const l = toPercent(seg.start);
                          const r = toPercent(seg.end);
                          return <div key={i} style={{
                            position: 'absolute',
                            top: '14px',
                            left: l + '%',
                            width: Math.max(0, r - l) + '%',
                            height: '10px',
                            background: segColors[i % segColors.length],
                            opacity: 0.4,
                            borderRadius: i === 0 ? '5px 0 0 5px' : i === numMons - 1 ? '0 5px 5px 0' : '0',
                            transition: dragging !== null ? 'none' : 'left 0.12s ease-out, width 0.12s ease-out',
                          }} />;
                        })}

                        {/* Tick marks */}
                        {Array.from({length: total - 1}).map((_, i) => {
                          const tick = i + 1;
                          const isMajor = tick % 5 === 0;
                          const isDivider = dividers.includes(tick);
                          if (isDivider) return null;
                          const pos = toPercent(tick);
                          return <div key={tick} style={{
                            position: 'absolute',
                            left: pos + '%',
                            top: isMajor ? '26px' : '28px',
                            width: '1px',
                            height: isMajor ? '6px' : '3px',
                            background: `rgba(255,255,255,${isMajor ? 0.25 : 0.1})`,
                            transition: dragging !== null ? 'none' : 'left 0.12s ease-out',
                          }} />;
                        })}

                        {/* Labels (collision-free) */}
                        {buildLabels().map(val => {
                          const pos = toPercent(val);
                          const isDividerVal = dividers.includes(val);
                          return <span key={val} style={{
                            position: 'absolute',
                            left: pos + '%',
                            top: '36px',
                            transform: 'translateX(-50%)',
                            fontSize: '0.6em',
                            opacity: isDividerVal ? 0.9 : 0.45,
                            fontWeight: isDividerVal ? 600 : 400,
                            color: isDividerVal ? 'var(--m3primary)' : '',
                            transition: dragging !== null ? 'none' : 'left 0.12s ease-out, opacity 0.2s',
                            pointerEvents: 'none',
                            whiteSpace: 'nowrap',
                          }}>{orderedWs[val - 1]?.name}</span>;
                        })}

                        {/* Divider handles */}
                        {dividers.map((val, idx) => {
                          const pos = toPercent(val);
                          const isActive = dragging === idx;
                          return (
                            <button key={idx} type="button" className="ws-divider"
                              aria-label={`Monitör sınırı ${idx + 1}: ${val} çalışma alanından sonra`}
                              style={{
                                position: 'absolute',
                                left: `calc(${pos}% - 12px)`,
                                top: '4px',
                                width: '24px',
                                height: '34px',
                                cursor: 'ew-resize',
                                display: 'flex',
                                flexDirection: 'column',
                                alignItems: 'center',
                                zIndex: 3,
                                border: 0,
                                padding: 0,
                                background: 'transparent',
                                transition: dragging !== null ? 'none' : 'left 0.12s ease-out',
                              }}
                              onPointerDown={e => onPointerDown(e, idx)}
                              onKeyDown={e => {
                                const delta = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
                                if (!delta) return;
                                e.preventDefault();
                                setDividers(old => {
                                  const next = [...old];
                                  next[idx] = Math.max(idx ? old[idx - 1] + 1 : 1,
                                    Math.min(idx < old.length - 1 ? old[idx + 1] - 1 : total - 1, old[idx] + delta));
                                  return next;
                                });
                              }}>
                              {/* Handle bar */}
                              <div style={{
                                width: isActive ? '6px' : '3px',
                                height: '20px',
                                borderRadius: '2px',
                                background: isActive ? '#fff' : 'rgba(255,255,255,0.65)',
                                boxShadow: isActive ? '0 0 8px rgba(255,255,255,0.4)' : 'none',
                                transition: 'width 0.12s, background 0.12s',
                              }} />
                              {/* Value badge */}
                              <span style={{
                                fontSize: '0.65em',
                                fontWeight: 600,
                                marginTop: '1px',
                                pointerEvents: 'none',
                                background: isActive ? 'var(--m3primary)' : 'rgba(255,255,255,0.12)',
                                padding: '1px 5px',
                                borderRadius: '3px',
                                color: isActive ? '#000' : 'rgba(255,255,255,0.8)',
                                transition: 'all 0.12s',
                              }}>{val}</span>
                            </button>
                          );
                        })}
                      </div>

                      {/* Segment → Monitor assignments */}
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', marginTop: '12px' }}>
                        {segments.map((seg, i) => (
                          <div key={i} style={{
                            display: 'flex',
                            alignItems: 'center',
                            gap: '12px',
                            padding: '10px 14px',
                            background: 'var(--colLayer2)',
                            borderRadius: '10px',
                            borderLeft: `3px solid ${segColors[i % segColors.length]}`,
                          }}>
                            <div style={{ flex: 1 }}>
                              <div style={{ fontWeight: 500, fontSize: '0.9em' }}>Workspace {orderedWs[seg.start]?.name}–{orderedWs[seg.end - 1]?.name}</div>
                              <div className="sub" style={{ fontSize: '0.8em' }}>{seg.count} çalışma alanı</div>
                            </div>
                            <select className="sel" value={segMon[i] ?? mons[i]?.index} onChange={e => {
                              let n = [...segMon];
                              n[i] = parseInt(e.target.value);
                              setSegMon(n);
                            }}>
                              {mons.map(m => <option key={m.index} value={m.index}>{m.name} · {m.w}×{m.h}</option>)}
                            </select>
                          </div>
                        ))}
                      </div>

                      <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '14px', gap: '8px', alignItems: 'center' }}>
                        {error && <span className="ws-inline-error">{error}</span>}
                        <button className="btn primary" disabled={busy} onClick={applyDivider}>Dağılımı uygula</button>
                      </div>
                    </div>
                  </div>
                </>
              )}

              {mode === 'custom' && (
                <>
                  <div className="sec-title">Tek tek atama</div>
                  <div className="card">
                    <div style={{ padding: '20px' }}>
                      <div className="sub" style={{ marginBottom: '16px' }}>
                        Kutucuğa tıklayarak monitör seçin. Değişiklikleri birlikte kaydedebilirsiniz.
                      </div>
                      <div className="ws-custom-grid">
                        {orderedWs.map(w => {
                          const mIdx = customMap[w.name] ?? mons[0].index;
                          const position = Math.max(0, mons.findIndex(m => m.index === mIdx));
                          const mon = mons[position];
                          return <button key={w.name} type="button" className="ws-custom-item"
                            title={`Workspace ${w.name} · ${mon.name} · ${mon.w}×${mon.h}`}
                            aria-label={`Workspace ${w.name}, ${mon.name}, ${mon.w}×${mon.h}. Değiştirmek için tıklayın.`}
                            onClick={() => setCustomMap(prev => ({ ...prev, [w.name]: mons[(position + 1) % numMons].index }))}>
                            <strong>{w.name}</strong>
                            <span><i style={{ background: segColors[position % segColors.length] }} /><span className="ws-monitor-name">{mon.name}</span></span>
                          </button>;
                        })}
                      </div>
                      <div className="ws-custom-actions">{error && <span className="ws-inline-error">{error}</span>}<button className="btn primary" disabled={busy} onClick={() => saveMap(customMap)}>Atamaları kaydet</button></div>
                    </div>
                  </div>
                </>
              )}
            </>
          );
        }


      // ---------------------------------------------------------------- Görünüm
        function LookPage({ s, update }) {
        const [theme, setTheme] = useState(window.llTheme?.get?.() ?? 'dark');
        const [hex, setHex] = useState('');
        const [bad, setBad] = useState(false);
        const [saving, setSaving] = useState(false);
        const [colorError, setColorError] = useState('');
        const [scaleSaving, setScaleSaving] = useState(false), [scaleError, setScaleError] = useState('');
        const setScale = async value => {
          if (scaleSaving) return;
          setScaleSaving(true); setScaleError('');
          try { await saveUiScale(value); update({ uiScale: value }); }
          catch (e) { setScaleError(`Arayüz ölçeği kaydedilemedi: ${e.message}`); }
          finally { setScaleSaving(false); }
        };
        useEffect(() => {
          const observer = new MutationObserver(() => setTheme(window.llTheme?.get?.() ?? 'dark'));
          observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
          return () => observer.disconnect();
        }, []);
        const setThemeTo = t => { if (window.llTheme && window.llTheme.get() !== t) window.llTheme.toggle(); setTheme(t); };
        const setColor = async c => {
          if (saving) return;
          setSaving(true); setColorError('');
          try {
            const response = await fetch('http://127.0.0.1:6131/focus-color?v=' + encodeURIComponent(c), { method: 'POST', signal: AbortSignal.timeout(8000) });
            const r = await response.json();
            if (!response.ok || !r?.ok) throw new Error(r?.error || 'Color could not be saved');
            update({ focusColor: r.focusColor }); applyAccent(r.focusColor);
          } catch (error) {
            console.error('Accent color:', error);
            setColorError('Renk kaydedilemedi. Yeniden dene.');
          } finally { setSaving(false); }
        };
        const applyHex = () => {
          const v = (hex.startsWith('#') ? hex : '#' + hex).toLowerCase();
          if (/^#[0-9a-f]{6}$/.test(v)) { setBad(false); setColor(v); } else setBad(true);
        };
        const custom = !COLORS.some(([, c]) => c === s.focusColor);
        return (
          <>
            <div className="sec-title">Tema</div>
            <div className="card">
              <Row icon={theme === 'light' ? 'light_mode' : 'dark_mode'} label="Kabuk teması" sub="Yalnızca Logical Lunge'u değiştirir, Windows temasına dokunmaz">
                <Seg items={[['dark', 'Koyu', 'dark_mode'], ['light', 'Aydınlık', 'light_mode']]} value={theme} onChange={setThemeTo} />
              </Row>
            </div>
            <div className="sec-title">Vurgu rengi</div>
            <div className="card">
              <Row icon="palette" label="Kabuk ve pencere kenarlıkları" sub="Bar, paneller ve etkin pencerenin rengi birlikte değişir" />
              <div className="swatches">
                {COLORS.map(([name, c]) => (
                  <button type="button" key={c} title={name} aria-label={name} aria-pressed={s.focusColor === c} disabled={saving} className={`sw ${s.focusColor === c ? 'sel' : ''}`} style={{ background: c }} onClick={() => setColor(c)} />
                ))}
              </div>
              <div className="hexrow">
                <span className="dot" style={{ background: s.focusColor }} />
                <input value={hex} placeholder={custom ? s.focusColor : '#rrggbb'} maxLength={7} spellCheck={false}
                  onChange={e => { setHex(e.target.value.trim()); setBad(false); }} onKeyDown={e => e.key === 'Enter' && applyHex()} />
                <button className="btn tonal" disabled={saving} onClick={applyHex}><Icon name="colorize" />Özel rengi uygula</button>
                {bad && <span className="err">Renk kodu #rrggbb biçiminde olmalı</span>}
              </div>
              {colorError && <div className="note" role="alert">{colorError}</div>}
            </div>
            <div className="sec-title">Pencere kenarlığı</div>
            <div className="card">
              <Row icon="border_outer" label="Kenarlık stili" sub="Vurgu: vurgu rengi, odak değişince bir an belirir. ii: nötr 1 px, pencere odaktayken kalıcı">
                <Seg items={[['accent', 'Vurgu', 'palette'], ['ii', 'ii (nötr, 1px, kalıcı)', 'border_style']]} value={s.borderStyle === 'ii' ? 'ii' : 'accent'}
                  onChange={v => helper(['--set-pref', 'borderStyle', v]).then(() => update({ borderStyle: v })).catch(() => {})} />
              </Row>
              <Row icon="wallpaper" label="Renkleri duvar kâğıdından al">
                <Switch on={s.wallpaperColors === true} onChange={v => helper(['--set-pref', 'wallpaperColors', String(v)]).then(() => update({ wallpaperColors: v })).catch(() => {})} />
              </Row>
            </div>
            <div className="sec-title">Arayüz ölçeği</div>
            <div className="card">
              <Row icon="zoom_in" label="Arayüz ölçeği" sub="Bar, paneller ve ayarlar birlikte ölçeklenir" />
              <div className="seg" role="group" aria-label="Arayüz ölçeği" style={{ flexWrap: 'wrap', margin: '8px 16px 16px' }}>
                {UI_SCALES.map(value => <button key={value} className={(s.uiScale ?? 100) === value ? 'sel' : ''} aria-pressed={(s.uiScale ?? 100) === value} disabled={scaleSaving} onClick={() => setScale(value)}>{value}%</button>)}
              </div>
              {scaleError && <div className="note" role="alert">{scaleError}</div>}
            </div>
            <div className="sec-title">Hareket</div>
            <div className="card">
              <Row icon="animation" label="Animasyonlar" sub="Workspace kaymaları, pencere açma / kapama / taşıma ve menü geçişleri">
                <Switch on={s.animations !== false} onChange={v => helper(['--set-pref', 'animations', String(v)]).then(() => update({ animations: v })).catch(() => {})} />
              </Row>
              {/* Yalnızca dokunmatik yüzeyli bilgisayarlarda; çekirdek hemen uygular */}
              {s.touchpad && (
                <Row icon="swipe" label="Dokunmatik yüzey hareketleri" sub="3 parmak: yana workspace kaydırır, yukarı overview, aşağı sağ panel; 4 parmak: pencereyi taşır">
                  <Switch on={s.gestures !== false} onChange={v => helper(['--set-pref', 'gestures', String(v)]).then(() => update({ gestures: v })).catch(() => {})} />
                </Row>
              )}
            </div>
            <div className="sec-title">Bildirimler</div>
            <div className="card">
              <ToastRow icon="notifications" label="Bilgi bildirimleri" k="toastInfo" s={s} update={update} />
              <ToastRow icon="warning" label="Uyarılar ve hatalar" k="toastError" s={s} update={update} />
              <Row icon="notifications_active" label="Windows bildirimleri" sub="Uygulamaların bildirimleri Logical Lunge kartı olarak çıkar; Windows'un balonları kapanır, Bildirim Merkezi'nde kalırlar">
                <Switch on={s.winToasts !== false} onChange={v => helper(['--set-pref', 'winToasts', String(v)]).then(() => update({ winToasts: v })).catch(() => {})} />
              </Row>
              <Row icon="visibility" label="Örnek göster" onClick={sampleToasts}>
                <Icon name="chevron_right" />
              </Row>
            </div>
          </>
        );
      }

      // Bildirimin ekranda kalma süresi (sn); bildirim widget'ı ll:prefs ile hemen yeni değere geçer
      function ToastRow({ icon, label, k, s, update }) {
        const timer = useRef(null);
        const v = s[k] ?? (k === 'toastError' ? 5 : 3);
        const slide = n => {
          update({ [k]: n });
          clearTimeout(timer.current);
          timer.current = setTimeout(() => helper(['--set-pref', k, String(n)]).catch(() => {}), 150);
        };
        return (
          <Row icon={icon} label={label} sub="Ekranda kalma süresi; üzerine gelince bekler">
            <div className="slider">
              <input type="range" min="1" max="30" step="1" value={v} onChange={e => slide(+e.target.value)} />
              <span className="val">{v} sn</span>
            </div>
          </Row>
        );
      }
      function sampleToasts() {
        emit('ll:toast', { kind: 'info', title: 'Örnek bildirim', body: 'Bilgi bildirimleri', icon: 'notifications' }).catch(() => {});
        emit('ll:toast', { kind: 'error', title: 'Örnek uyarı', body: 'Uyarılar ve hatalar', icon: 'warning' }).catch(() => {});
      }

      // Arayüz tercihleri kabuk yeniden açılınca uygulanır (pencere yöneticisi ve animasyonlar hemen)
      function ApplyNote() {
        return (
          <div className="apply-float" role="status">
            <Icon name="pending_actions" />
            <span>Arayüz değişiklikleri hazır<small>Kabuğu yeniden açınca uygulanır.</small></span>
            <button className="btn" onClick={() => helper(['--restart-shell']).catch(() => {})}><Icon name="refresh" />Şimdi uygula</button>
          </div>
        );
      }

      // ---------------------------------------------------------------- Dil ve saat
      function LangPage({ s, update }) {
        const now = new Date();
        const t24 = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', hour12: false });
        const t12 = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        const set = (k, v) => helper(['--set-pref', k, v]).then(o => { if (json(o)?.ok) update({ [k]: v, dirty: true }); }).catch(() => {});
        return (
          <>
            <div className="sec-title">Dil</div>
            <div className="card">
              <Row icon="translate" label="Arayüz dili" sub="Sistem dili seçiliyse Windows'un dili kullanılır">
                <select value={s.language || 'system'} onChange={e => set('language', e.target.value)}>
                  {LANGS.map(([k, name]) => <option key={k} value={k}>{name}</option>)}
                </select>
              </Row>
            </div>
            <div className="sec-title">Saat</div>
            <div className="card">
              <Row icon="schedule" label="Saat biçimi" sub="Bar, bildirimler ve pano geçmişi">
                <Seg items={[['24', `24 saat · ${t24}`], ['12', `12 saat · ${t12}`]]} value={s.clock || '24'} onChange={v => set('clock', v)} />
              </Row>
            </div>
          </>
        );
      }

      // ---------------------------------------------------------------- Kısayollar
      function KeysPage({ close }) {
        const openEditor = () => { close(); setTimeout(() => emit('ll:sidebar-open-page', 'keys').catch(() => {}), 180); };
        return (
          <>
            <div className="sec-title">Logical Lunge kısayolları</div>
            <div className="card">
              <Row icon="keyboard" label="Kısayolları düzenle" sub="Super, workspace geçişleri, pencere taşıma, uygulamalar: sağ paneldeki düzenleyicide" onClick={openEditor}>
                <Icon name="chevron_right" />
              </Row>
            </div>
            <div className="sec-title">Pencere yöneticisi</div>
            <div className="card">
              <Row icon="data_object" label="Pencere yöneticisi kısayolları" sub="config.yaml dosyasının keybindings bölümünde; kaydedince hemen uygulanır" onClick={() => helper(['--edit-config']).catch(() => {})}>
                <Icon name="open_in_new" />
              </Row>
            </div>
          </>
        );
      }

      // ---------------------------------------------------------------- Gece ışığı
      function NightPage() {
        const [n, setN] = useState(null);
        const [level, setLevel] = useState(50);
        const timer = useRef(null);
        const apply = o => { const r = json(o); if (r) { setN(r); setLevel(r.level ?? 50); } };
        useEffect(() => { helper(['--nightlight', 'status']).then(apply).catch(() => {}); }, []);
        const set = (k, v) => helper(['--nightlight-set', k, String(v)]).then(apply).catch(() => {});
        const slide = v => { setLevel(v); clearTimeout(timer.current); timer.current = setTimeout(() => set('level', v), 60); };
        if (!n) return null;
        const mode = n.mode || 'manual';
        const kelvin = Math.round((6500 - 46 * level) / 100) * 100;
        return (
          <>
            <div className="sec-title">Gece ışığı</div>
            <div className="card">
              <Row icon="nightlight" label="Gece ışığı" sub="Ekranın mavi ışığını azaltır (tüm monitörler)">
                <Switch on={!!n.on} onChange={() => helper(['--nightlight', 'toggle']).then(apply).catch(() => {})} />
              </Row>
              <Row icon="schedule" label="Zamanlama">
                <Seg items={[['manual', 'Her zaman', 'wb_sunny'], ['after', 'Saatten sonra', 'bedtime'], ['range', 'Saat aralığı', 'schedule']]} value={mode} onChange={v => set('mode', v)} />
              </Row>
              {mode !== 'manual' && (
                <Row icon="more_time" label="Saatler" sub={mode === 'after' ? "Sabah 07:00'de kapanır" : null}>
                  <input type="time" value={n.from || '20:00'} onChange={e => e.target.value && set('from', e.target.value)} />
                  {mode === 'range' && <input type="time" value={n.to || '07:00'} onChange={e => e.target.value && set('to', e.target.value)} />}
                </Row>
              )}
              <Row icon="tonality" label="Yoğunluk">
                <div className="slider">
                  <input type="range" min="0" max="100" step="5" value={level} onChange={e => slide(+e.target.value)} />
                  <span className="val">%{level} · {kelvin}K</span>
                </div>
              </Row>
            </div>
          </>
        );
      }

      // ---------------------------------------------------------------- Sistem sağlığı
      const PART_NAMES = { core: ['Çekirdek', 'memory'], tiling: ['Pencere yöneticisi', 'grid_view'], shell: ['Kabuk', 'web_asset'] };
      function HealthPage({ open, s }) {
        const [h, setH] = useState(null);
        const load = useCallback(() => helper(['--health']).then(o => { const r = json(o); if (r) setH(r); }).catch(() => {}), []);
        useEffect(() => {
          if (!open) return;
          load();
          // Ayarlar odak kaybında kapanmaz: yalnızca bakılırken yenilenir (her yenileme bir süreç)
          const t = setInterval(() => { if (document.hasFocus()) load(); }, 3000);
          return () => clearInterval(t);
        }, [open]);
        if (!h) return null;
        return (
          <>
            <div className="sec-title">Parçalar</div>
            <div className="parts">
              {h.parts.map(p => {
                const [name, icon] = PART_NAMES[p.key] || [p.key, 'widgets'];
                return (
                  <div key={p.key} className="part">
                    <div className="ph"><Icon name={icon} />{name}</div>
                    <span className={`state ${p.running ? '' : 'bad'}`}>{p.running ? 'Çalışıyor' : 'Çalışmıyor'}</span>
                    {p.running && <div className="stat"><span>Açık süre</span><span>{formatUptime(p.uptime)}</span></div>}
                    {p.running && <div className="stat"><span>Bellek</span><span>{p.memMB ?? '—'} MB</span></div>}
                  </div>
                );
              })}
            </div>
            <div className="sec-title">Durum</div>
            <div className="card">
              <Row icon="admin_panel_settings" label="Yönetici haklarıyla" sub="Kısayollar ve pencere yönetimi Görev Yöneticisi gibi yönetici pencerelerinde de çalışır">
                <span className={`state ${h.elevated ? '' : 'bad'}`}>{h.elevated ? 'Evet' : 'Hayır'}</span>
              </Row>
              <Row icon="flight" label="Kara kutu" sub={h.blackBox ? h.blackBox.replace(/^(\S+) KARA KUTU: /, '$1 · ') : 'Yavaşlama kaydı yok'} />
            </div>
            {h.events?.length > 0 && (
              <>
                <div className="sec-title">Son olaylar</div>
                <div className="card"><div className="log">{h.events.join('\n')}</div></div>
              </>
            )}
            <div className="sec-title">İşlemler</div>
            <div className="btns">
              <button className="btn" onClick={() => helper(['--restart-desktop']).catch(() => {})}><Icon name="restart_alt" />Masaüstünü yenile</button>
              <button className="btn tonal" onClick={() => helper(['--black-box']).then(load).catch(() => {})}><Icon name="flight" />Kara kutu kaydı al</button>
              <button className="btn outline" onClick={() => lunge.shellSpawn('explorer', [h.logsDir]).catch(() => {})}><Icon name="folder_open" />Log klasörünü aç</button>
            </div>
          </>
        );
      }

      // ---------------------------------------------------------------- Gelişmiş
      function AdvancedPage({ s, update }) {
        return (
          <>
            <div className="sec-title">Ayar dosyaları</div>
            <div className="card">
              <Row icon="folder_open" label="Ayar klasörünü aç" sub={s.configDir} onClick={() => lunge.shellSpawn('explorer', [s.configDir]).catch(() => {})}><Icon name="open_in_new" /></Row>
              <Row icon="edit_document" label="config.yaml'ı düzenle" sub="Pencere yöneticisi, kenarlıklar, kurallar ve kısayollar" onClick={() => helper(['--edit-config']).catch(() => {})}><Icon name="open_in_new" /></Row>
            </div>
            <div className="sec-title">Pencere yöneticisi</div>
            <div className="card">
              <Row icon="sync" label="Pencere yöneticisi ayarlarını yenile" sub="config.yaml'daki değişiklikleri yeniden okur" onClick={() => helper(['--wm', 'wm-reload-config']).catch(() => {})}><Icon name="chevron_right" /></Row>
              <Row icon="refresh" label="Pencereleri yeniden çiz" sub="Yerleşim bozulduysa pencereleri yeniden yerleştirir" onClick={() => helper(['--wm', 'wm-redraw']).catch(() => {})}><Icon name="chevron_right" /></Row>
            </div>
            <div className="sec-title">Windows</div>
            <div className="card">
              <Row icon="desktop_windows" label="Windows'un yerini al" sub="Logical Lunge açıkken Windows'un görev çubuğu, yerleşim önerileri ve benzeri parçaları kapanır; kapanınca eski hâline döner">
                <Switch on={s.takeover !== false} onChange={v => helper(['--set-pref', 'takeover', String(v)]).then(() => update({ takeover: v })).catch(() => {})} />
              </Row>
              <Row icon="palette" label="Windows temasını eşitle" sub="Koyu/açık tercihiniz ve vurgu renginiz Windows'a da uygulanır; Windows'un kendi pencereleri bize uyar. Windows'un yerini al açıkken çalışır; kapanınca eski tema geri gelir">
                <Switch on={s.themeSync !== false} onChange={v => helper(['--set-pref', 'themeSync', String(v)]).then(() => update({ themeSync: v })).catch(() => {})} />
              </Row>
            </div>
          </>
        );
      }

      // ---------------------------------------------------------------- Hakkında
      function AboutPage({ s, close }) {
        return (
          <>
            <div className="card">
              <div className="about">
                <div className="logo">
                  <i style={{ left: 15, top: 13, width: 11, height: 38 }} />
                  <i style={{ left: 15, top: 40, width: 34, height: 11 }} />
                  <i style={{ left: 31, top: 13, width: 18, height: 22, background: '#7f67be' }} />
                </div>
                <div className="txt">
                  <h2>Logical Lunge <span className="edition" translate="no">Web version</span></h2>
                  <span className="sub">{`Sürüm ${s.version || '—'} · GPL-3.0`}</span>
                </div>
              </div>
            </div>
            <div className="sec-title">Güncellemeler</div>
            <div className="card">
              <Row icon="system_update_alt" label="Güncellemeleri denetle" sub="Yeni sürüm varsa sağ üstte bir kart çıkar" onClick={() => { close(); emit('ll:update-check').catch(() => {}); }}><Icon name="chevron_right" /></Row>
              <Row icon="code" label="Kaynak kodu" sub="github.com/KaanAlper/logical-lunge" onClick={() => helper(['--open', 'https://github.com/KaanAlper/logical-lunge']).catch(() => {})}><Icon name="open_in_new" /></Row>
            </div>
          </>
        );
      }

      function App() {
        const [open, setOpen] = useState(false);
        const [page, setPage] = useState('look');
        const [s, setS] = useState({});
        const update = useCallback(patch => setS(x => ({ ...x, ...patch })), []);
        const load = useCallback(() => helper(['--settings-get']).then(o => { const r = json(o); if (r) setS(x => ({ ...r, dirty: x.dirty })); }).catch(() => {}), []);

        const wantOpen = useRef(false);
        const hide = useCallback(() => {
          wantOpen.current = false;
          setOpen(false);
          // Kapanış animasyonundan sonra; bu arada yeniden açıldıysa gizleme
          setTimeout(() => { if (!wantOpen.current) lunge.hideWindow(win).catch(() => {}); }, 220);
        }, []);
        const show = useCallback(async () => {
          wantOpen.current = true;
          load();
          try { await lunge.showWindow(win); } catch {}
          // en üste al ve odakla (kabuğun setAlwaysOnTop'u gizle/göster sonrası etkisiz kalabiliyor)
          helper(['--raise', 'Logical Lunge · settings']).catch(() => {});
          // Kare gelmezse (sayfa hâlâ gizli sayılıyorsa) zamanlayıcı açar: pencere boş kalmasın
          const go = () => { if (wantOpen.current) setOpen(true); };
          requestAnimationFrame(go);
          setTimeout(go, 60);
        }, []);

        useEffect(() => { lunge.hideWindow(win).catch(() => {}); lunge.reviveOnFocus(win); }, []);
        useEffect(() => {
          const un1 = listen('ll:settings-toggle', () => (open ? hide() : show()));
          const un2 = listen('ll:overview-toggle', () => { if (open) hide(); });
          const onKey = e => { if (e.key === 'Escape') hide(); };
          window.addEventListener('keydown', onKey);
          return () => { un1.then(f => f()); un2.then(f => f()); window.removeEventListener('keydown', onKey); };
        }, [open]);

        const title = SECTIONS.find(x => x[0] === page)?.[2];
        return (
          <div className={`win ${open ? 'open' : ''}`}>
            <nav className="nav">
              <div className="nav-title"><Icon name="settings" fill />Ayarlar</div>
              {SECTIONS.map(([k, icon, label]) => (
                <button key={k} className={page === k ? 'sel' : ''} onClick={() => setPage(k)}><Icon name={icon} />{label}</button>
              ))}
            </nav>
            <div className="main">
              <div className="head">
                <h1>{title}</h1>
                <button className="qbtn" title="Ayarları kapat" onClick={hide}><Icon name="close" /></button>
              </div>
              <div className="body">
                {page === 'look' && <LookPage s={s} update={update} />}
                {page === 'workspaces' && <WorkspacesPage s={s} update={update} />}
                {page === 'lang' && <LangPage s={s} update={update} />}
                {page === 'keys' && <KeysPage close={hide} />}
                {page === 'night' && <NightPage />}
                {page === 'health' && <HealthPage open={open} s={s} />}
                {page === 'adv' && <AdvancedPage s={s} update={update} />}
                {page === 'about' && <AboutPage s={s} close={hide} />}
              </div>
              {s.dirty && <ApplyNote />}
            </div>
          </div>
        );
      }

      createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
