<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <script>
// Logical Lunge dil katmanı: arayüz Türkçe yazılır; sistem dili Türkçe değilse ekrandaki metinler,
// title ve placeholder'lar i18n.json'dan çevrilir (13 dil; olmayan dil İngilizceye düşer, Arapça sağdan sola).
// Tarih/ay/gün adları window.LL_LOCALE ile (Intl) aynı dilde. Yeni dil / metin: i18n.src.js.
// Kurulumda seçilen dil ve saat prefs.json'da ({"language": "system" | "tr" | "en" ..., "clock": "24" | "12"}):
// dil "system" değilse sistem dilinin yerine geçer; window.LL_HOUR12 saatlerin 12 saatlik (AM/PM) çizilmesi içindir.
(function () {
  var prefs = {};
  try {
    var px = new XMLHttpRequest(); px.open('GET', './prefs.json', false); px.send();
    if (px.status === 200) prefs = JSON.parse(px.responseText) || {};
  } catch (e) {}
  window.LL_PREFS = prefs;
  window.LL_HOUR12 = prefs.clock === '12';
  var lang = prefs.language && prefs.language !== 'system' ? prefs.language
    : (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
  window.LL_LOCALE = lang;
  var code = lang.slice(0, 2).toLowerCase();
  window.LL_T = function (s) { return s; };
  if (code === 'tr') return;
  var data = null;
  try {
    // Sayfa çizilmeden önce hazır olsun diye eşzamanlı (yerel kabuk sunucusundan, ~1 ms)
    var x = new XMLHttpRequest(); x.open('GET', './i18n.json', false); x.send();
    if (x.status === 200) data = JSON.parse(x.responseText);
  } catch (e) {}
  if (!data) return;
  if (data.langs.indexOf(code) < 0) code = 'en';
  if (code === 'ar') document.documentElement.dir = 'rtl';
  document.documentElement.lang = code;
  var vals = data[code], dict = {}, pats = [];
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  data.keys.forEach(function (k, i) {
    if (/\$\d/.test(k)) {
      // "$1 zaten "$2" için..." -> (.+?) grupları; hangi grubun $kaç olduğunu sırayla tut
      var order = (k.match(/\$\d/g) || []).map(function (x) { return +x.charAt(1); });
      pats.push([new RegExp('^' + esc(k).replace(/\\\$\d/g, '(.+?)') + '$'), vals[i], order]);
    }
    else dict[k] = vals[i];
  });
  // Başı sabit metinle başlayan desenler önce: "Açık · 20:00 sonrası" -> Açık · (20:00 sonrası)
  pats.sort(function (a, b) { return (a[0].source.indexOf('^(') === 0) - (b[0].source.indexOf('^(') === 0); });
  function T(s) {
    if (!s) return s;
    var k = s.trim();
    if (!k || !/[A-Za-zÇĞİÖŞÜçğıöşü]/.test(k)) return s;
    var v = dict[k];
    if (v === undefined) {
      for (var i = 0; i < pats.length; i++) {
        var m = k.match(pats[i][0]);
        if (m) {
          v = pats[i][1];
          for (var j = 0; j < pats[i][2].length; j++) v = v.replace('$' + pats[i][2][j], T(m[j + 1])); // iç içe: "Açık · 20:00 sonrası"
          break;
        }
      }
    }
    return v === undefined ? s : s.replace(k, v);
  }
  window.LL_T = T;
  function fixNode(n) {
    if (n.nodeType === 3) { var t = T(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; return; }
    if (n.nodeType !== 1) return;
    if (n.classList && n.classList.contains('icon')) return; // ikon adları (Material Symbols ligatürleri)
    ['title', 'placeholder', 'aria-label'].forEach(function (a) {
      var v = n.getAttribute && n.getAttribute(a);
      if (v) { var t = T(v); if (t !== v) n.setAttribute(a, t); }
    });
    for (var c = n.firstChild; c; c = c.nextSibling) fixNode(c);
  }
  new MutationObserver(function (list) {
    for (var i = 0; i < list.length; i++) {
      var m = list[i];
      if (m.type === 'characterData') {
        var p = m.target.parentNode;
        if (!(p && p.classList && p.classList.contains('icon'))) fixNode(m.target);
      } else if (m.type === 'attributes') fixNode(m.target);
      else for (var j = 0; j < m.addedNodes.length; j++) {
        var a = m.addedNodes[j], par = a.parentNode;
        if (a.nodeType === 3 && par && par.classList && par.classList.contains('icon')) continue;
        fixNode(a);
      }
    }
  }).observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['title', 'placeholder', 'aria-label'] });
})();
    </script>
    <script>
// Logical Lunge kabuk teması (ii'deki karanlık/aydınlık düğmesi). Windows temasına dokunmaz.
// Tek kaynak çekirdekteki prefs.json "theme" anahtarı (native bar da onu okur). localStorage 'll.theme' onun sayfa
// çizilmeden okunabilen kopyası: bir widget değiştirince diğerleri 'storage' olayıyla anında güncellenir; başka yerden
// gelen değişikliği (native bar, ayarlar) bildirim widget'ı çekirdeğin olay akışından alıp llTheme.set ile buraya yazar.
(function () {
  function read() {
    try { return localStorage.getItem('ll.theme') === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; }
  }
  function write(t) { try { localStorage.setItem('ll.theme', t); } catch (e) {} }
  function apply() { document.documentElement.dataset.theme = read(); }
  function save(t) {
    try { var x = new XMLHttpRequest(); x.open('POST', 'http://127.0.0.1:6131/pref?k=theme&v=' + t); x.send(); } catch (e) {}
  }
  var P = window.LL_PREFS || {};
  if (P.theme === 'light' || P.theme === 'dark') write(P.theme);
  else if (read() === 'light') save('light'); // eski sürümden: tercih yalnızca bu tarayıcı deposundaydı
  apply();
  window.addEventListener('storage', function (e) { if (e.key === 'll.theme') apply(); });
  window.llTheme = {
    get: read,
    // Başka yerden gelen değişiklik (kaydedilmez, zaten kayıtlı)
    set: function (t) { if (t === 'light' || t === 'dark') { write(t); apply(); } return read(); },
    toggle: function () {
      var next = read() === 'light' ? 'dark' : 'light';
      write(next);
      apply();
      save(next);
      return next;
    }
  };
})();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./sidebar.css" />
    <link rel="stylesheet" type="text/css" href="./menu.css" />
    <style>
      .parity-report { font-size: 13px; }
      .parity-report input[type="datetime-local"], .parity-report textarea {
        box-sizing: border-box; padding: 10px; border: 1px solid var(--m3outlineVariant);
        border-radius: 12px; background: var(--colLayer1); color: var(--m3onSurface);
        font: inherit; color-scheme: dark;
      }
      .parity-report textarea::placeholder { color: var(--m3onSurfaceVariant); }
      .parity-report input:focus-visible, .parity-report textarea:focus-visible { outline: 2px solid var(--m3primary); outline-offset: 1px; }
      :root[data-theme="light"] .parity-report input[type="datetime-local"] { color-scheme: light; }
    </style>

  <body>
    <div id="root"></div>
    <script type="module">
      // ii modules/ii/sidebarRight/SidebarRightContent.qml:
      //   SystemButtonRow, AndroidQuickPanel (quickToggles.style = "android"),
      //   CenterWidgetGroup (NotificationList), BottomWidgetGroup (takvim / yapılacaklar / zamanlayıcı)
      import React, { useState, useEffect, useLayoutEffect, useRef, useCallback } from 'react';
      import { createRoot } from 'react-dom/client';
      import * as lunge from 'lunge/shell';
      import { listen, emit } from '@tauri-apps/api/event';
      import { invoke } from '@tauri-apps/api/core';
      import { expandedToggle, importedSaver, checkSwitch } from '../parity-sidebar.mjs';
      import { IssueReport, GalleryMenu } from '../parity-sidebar-components.jsx';

      const win = lunge.currentWidget().tauriWindow;
      const HELPER = '{{INSTALL_ESC}}\\lunge.exe';
      const LL = '{{INSTALL_ESC}}\\scripts';
      const providers = lunge.createProviderGroup({
        audio: { type: 'audio' },
        host: { type: 'host', refreshInterval: 60000 },
        network: { type: 'network', refreshInterval: 10000 },
        tiling: { type: 'tiling' },
      });

      const Icon = ({ name, fill }) => <span className={`icon ${fill ? 'fill' : ''}`}>{name}</span>;
      // Hepsi çekirdek üzerinden: hiç konsol penceresi açılmaz
      const helper = args => lunge.shellExec(HELPER, args).then(r => (r.stdout || '').trim());
      // Hızlı ayarlar çekirdekte (eskiden her panel açılışında dört PowerShell betiği): /qs/radios, /qs/eth, /qs/bt ...
      const qs = path => fetch(`http://127.0.0.1:6131/qs/${path}`, { method: 'POST', cache: 'no-store' })
        .then(r => (r.ok ? r.text() : Promise.reject(new Error(`qs ${path}: ${r.status}`))));
      const json = s => { try { return JSON.parse(s); } catch { return null; } };
      const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
      const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

      function App() {
        const [open, setOpen] = useState(false);
        const [page, setPage] = useState(null); // 'keys' | 'walls' | 'bug'
        const [bugSending, setBugSending] = useState(false);
        // Kapanınca açık sayfa bir süre kalır: panel odak gidince kapanır (bir şeye bakmak için başka pencereye
        // geçmek gibi); birkaç dakika içinde yeniden açılınca bırakıldığı gibi gelir.
        const closedAt = useRef(0);
        useEffect(() => { if (!open) closedAt.current = Date.now(); else if (Date.now() - closedAt.current > 180000) setPage(null); }, [open]);
        const [o, setO] = useState(providers.outputMap);
        const openedFocus = useRef(null);
        // Gizliyken sağlayıcı çıktıları paneli yeniden çizdirmez (her pencere olayında bütün panel yeniden
        // hesaplanıyordu); açılırken son çıktılarla bir kez çizilir.
        const live = useRef(false);
        useEffect(() => { providers.onOutput(() => { if (live.current) setO({ ...providers.outputMap }); }); }, []);

        const wantOpen = useRef(false);
        const hide = useCallback(() => {
          wantOpen.current = false;
          setOpen(false);
          // Kapanış animasyonundan sonra; bu arada yeniden açıldıysa gizleme
          setTimeout(() => {
            if (wantOpen.current) return;
            live.current = false;
            lunge.hideWindow(win).catch(() => {});
          }, 260);
        }, []);
        const show = useCallback(async () => {
          wantOpen.current = true;
          live.current = true;
          setO({ ...providers.outputMap });
          openedFocus.current = providers.outputMap.tiling?.focusedContainer?.id ?? null;
          // Gizlenip yeniden gösterilince "her zaman üstte" düşebiliyor: her açılışta yeniden ver
          try { await lunge.showWindow(win); } catch {}
          // Kabuğun setAlwaysOnTop'u gizle/göster sonrası etkisiz: helper Windows API ile en üste alıp odaklar
          helper(['--raise', 'Logical Lunge · sidebar-right']).catch(() => {});
          // Kare gelmezse (sayfa hâlâ gizli sayılıyorsa) zamanlayıcı açar: panel boş pencere olarak kalmasın
          const go = () => { if (wantOpen.current) setOpen(true); };
          requestAnimationFrame(go);
          setTimeout(go, 60);
        }, []);

        useEffect(() => { lunge.hideWindow(win).catch(() => {}); lunge.reviveOnFocus(win); }, []);

        useEffect(() => {
          const un1 = listen('ll:sidebar-right-toggle', () => (open ? hide() : show()));
          const un2 = listen('ll:overview-toggle', () => { if (open) hide(); });
          // Ayarlar penceresinden: paneli bir sayfasıyla aç (ör. kısayol düzenleyicisi)
          const un3 = listen('ll:sidebar-open-page', e => { setPage(e.payload); if (!open) show(); });
          // Kabuğun dışına tıklandı (çekirdeğin fare kancası): panel odak almadan açıldıysa "blur" hiç gelmiyordu
          const un4 = listen('ll:outside-click', () => { if (open) hide(); });
          // Bar'a basıldı (native bar odak almaz: blur gelmez)
          const un5 = listen('ll:bar-click', () => { if (open) hide(); });
          const onBlur = () => { if (open) hide(); };
          const onKey = e => { if (e.key === 'Escape' && !window.__llSidebarModal) hide(); };
          window.addEventListener('blur', onBlur);
          window.addEventListener('keydown', onKey);
          return () => { un1.then(f => f()); un2.then(f => f()); un3.then(f => f()); un4.then(f => f()); un5.then(f => f()); window.removeEventListener('blur', onBlur); window.removeEventListener('keydown', onKey); };
        }, [open]);

        // Panel her zaman odak almayabiliyor (blur hiç gelmez): başka pencereye odak geçince
        // (tık, kısayol ya da fareyle) kapan.
        const focusedId = o.tiling?.focusedContainer?.id;
        useEffect(() => {
          if (open && openedFocus.current !== null && focusedId && focusedId !== openedFocus.current) hide();
        }, [focusedId]);

        return (
          <div className={`panel ${open ? '' : 'closed'}`}>
            <SystemButtonRow host={o.host} onPage={setPage} />
            <AndroidQuickPanel o={o} open={open} />
            <NotificationList open={open} />
            <BottomWidgetGroup />
            {page === 'keys' && <ShortcutsPage onClose={() => setPage(null)} />}
            {page === 'walls' && <WallpaperPage onClose={() => setPage(null)} />}
            {page === 'bug' && <Page title="Hata raporu" icon="bug_report" onClose={() => setPage(null)} canClose={!bugSending}><IssueReport helper={helper} load={load} save={save} host={o.host} onSending={setBugSending} /></Page>}
          </div>
        );
      }

      // ======================= Sayfalar: Kısayollar / Duvar kağıtları =======================
      // Panelin üstüne sağdan kayarak açılan tam sayfalar (ii WindowDialog hissi, panel içinde).
      function Page({ title, icon, onClose, actions, children, canClose = true }) {
        const [shown, setShown] = useState(false);
        useEffect(() => { requestAnimationFrame(() => setShown(true)); }, []);
        const close = () => { if (canClose) { setShown(false); setTimeout(onClose, 260); } };
        useEffect(() => {
          const k = e => { if (e.key === 'Escape' && !window.__llCapturing && !window.__llSidebarModal) { e.stopPropagation(); close(); } };
          window.addEventListener('keydown', k, true);
          return () => window.removeEventListener('keydown', k, true);
        }, [canClose]);
        return (
          <div className={`page ${shown ? 'shown' : ''}`}>
            <div className="page-head">
              <button className="qbtn" disabled={!canClose} onClick={close} title="Geri"><Icon name="arrow_back" /></button>
              <Icon name={icon} />
              <span className="page-title">{title}</span>
              <div className="page-actions">{actions}</div>
            </div>
            <div className="page-body">{children}</div>
          </div>
        );
      }

      const low = s => String(s || '').toLocaleLowerCase(window.LL_LOCALE);

      // ---- Kısayollar ----
      const LL_LABELS = {
        'focus-left': 'Sola odaklan', 'focus-right': 'Sağa odaklan', 'focus-up': 'Yukarı odaklan', 'focus-down': 'Aşağı odaklan',
        'move-left': 'Pencereyi sola taşı', 'move-right': 'Pencereyi sağa taşı', 'move-up': 'Pencereyi yukarı taşı', 'move-down': 'Pencereyi aşağı taşı',
        'ws-prev': 'Önceki workspace', 'ws-next': 'Sonraki workspace',
        'ws-move-prev': "Pencereyi önceki workspace'e taşı", 'ws-move-next': "Pencereyi sonraki workspace'e taşı",
        terminal: 'Terminal', 'terminal-alt': 'Terminal (ikinci kısayol)', browser: 'Tarayıcı', files: 'Dosya yöneticisi',
        code: 'Kod editörü', editor: 'Metin editörü', close: 'Pencereyi kapat', screenshot: 'Ekran alıntısı', 'screenshot-screen': 'Monitörün tamamı (panoya)', clipboard: 'Pano geçmişi',
        'file-search': 'Dosya araması', 'screenshot-alt': 'Ekran alıntısı (ikinci kısayol)', 'overview-alt': 'Super menüsü',
        run: 'Çalıştır', search: 'Ara (Super menüsü)', workspaces: "Workspace'ler (Super menüsü)", settings: 'Ayarlar',
        sidebar: 'Sağ panel', notifications: 'Bildirimler', 'task-manager': 'Görev Yöneticisi',
      };
      const llLabel = id => LL_LABELS[id] || (id.startsWith('ws-') ? `Workspace ${id.slice(3)}` : id);
      const llGroup = id => id.startsWith('focus-') || id.startsWith('move-') || id === 'close' ? 'win'
        : (id.startsWith('ws-') || id === 'workspaces') ? 'ws' : 'sys';
      function tilingLabel(cmds) {
        const c = cmds.join(' ; ');
        let m;
        if ((m = c.match(/^move --workspace (\d+)$/))) return `Pencereyi workspace ${m[1]}'e gönder`;
        const map = {
          'focus --prev-workspace': 'Önceki workspace (PageUp)', 'focus --next-workspace': 'Sonraki workspace (PageDown)',
          'focus --prev-active-workspace': 'Önceki dolu workspace', 'focus --next-active-workspace': 'Sonraki dolu workspace',
          'move --prev-workspace ; focus --prev-workspace': "Pencereyi önceki workspace'e taşı (PageUp)",
          'move --next-workspace ; focus --next-workspace': "Pencereyi sonraki workspace'e taşı (PageDown)",
          'toggle-fullscreen': 'Tam ekran', 'toggle-fullscreen-spoof': 'Yuvasında tam ekran (spoof)', 'toggle-floating --centered': 'Yüzen pencere', 'toggle-tiling-direction': 'Bölme yönünü değiştir',
          'toggle-minimized': 'Simge durumuna küçült', 'wm-cycle-focus': 'Yüzen / döşeli pencereler arasında geç',
          'resize --width -10%': 'Pencereyi daralt', 'resize --width +10%': 'Pencereyi genişlet', 'wm-enable-binding-mode --name resize': 'Boyutlandırma modu',
          'shell-exec ms-settings:': 'Windows ayarları', 'shell-exec sndvol': 'Ses karıştırıcı',
          'wm-reload-config': 'Pencere yöneticisi ayarlarını yenile', 'wm-redraw': 'Pencereleri yeniden çiz', 'wm-toggle-pause': 'Döşemeyi duraklat', 'wm-exit': "Logical Lunge'dan çık",
        };
        if (map[c]) return map[c];
        if (/wezterm/i.test(c)) return 'Terminal (yedek)';
        return c;
      }
      const tilingGroup = cmds => {
        const c = cmds.join(' ');
        if (/workspace/.test(c)) return 'ws';
        if (/shell-exec/.test(c)) return 'app';
        if (/^wm-(reload|redraw|toggle-pause|exit)/.test(c)) return 'sys';
        return 'win';
      };
      const GROUPS = [['win', 'Pencereler', 'select_window'], ['ws', 'Workspace', 'view_carousel'], ['app', 'Uygulamalar', 'apps'], ['sys', 'Sistem', 'settings']];
      const KEY_GLYPH = { Left: '←', Right: '→', Up: '↑', Down: '↓', Enter: '↵', PageUp: 'PgUp', PageDown: 'PgDn', Escape: 'Esc' };

      function Keycaps({ combo }) {
        if (!combo) return <span className="kc-none">—</span>;
        return (
          <span className="kcs">
            {combo.split('+').map((k, i) => (
              <span key={i} className={`kc ${k === 'Super' ? 'super' : ''}`}>
                {k === 'Super' ? <><svg viewBox="0 0 24 24" width="11" height="11"><path fill="currentColor" d="M3 5.5 10 4.5v7H3zM11 4.4 21 3v8.5H11zM3 12.5h7v7l-7-1zM11 12.5h10V21l-10-1.4z"/></svg>Super</> : (KEY_GLYPH[k] || k)}
              </span>
            ))}
          </span>
        );
      }

      function ShortcutsPage({ onClose }) {
        // Çekirdeğin kısayol modeli (--keybinds-model): kendi kısayolları, eklenen uygulamalar, pencere yöneticisininkiler
        // ve Windows'un bırakmadıkları. Değişiklikler bekletilir; her değişiklikte bütün durumun çakışmaları çekirdeğe
        // sorulur (--keybinds-check), çakışan satırlar kırmızı yanar. "Kaydet" hepsini yazar (--keybinds-save).
        const [model, setModel] = useState(null);
        const [staged, setStaged] = useState({ core: {}, apps: [], removed: [], tiling: {} });
        const [conflicts, setConflicts] = useState([]);
        const [locked, setLocked] = useState(true);
        const [capturing, setCapturing] = useState(null); // satır anahtarı
        const [msg, setMsg] = useState(null);
        const [q, setQ] = useState('');
        const [picker, setPicker] = useState(false);
        const [pickQ, setPickQ] = useState('');
        const [apps, setApps] = useState([]);
        const [reset, setReset] = useState(null); // null | { apps: bool }
        const [shake, setShake] = useState(0);
        const [busy, setBusy] = useState(false);
        const checkSeq = useRef(0);

        const fresh = m => ({
          core: {},
          apps: (m.core || []).filter(b => b.custom).map(b => ({ id: b.id, name: b.name, path: b.path, combo: b.combo })),
          removed: (m.core || []).filter(b => b.removed).map(b => b.id),
          tiling: {},
        });
        const load = useCallback(() => {
          helper(['--keybinds-model']).then(s => {
            const m = json(s);
            if (!m || !Array.isArray(m.core)) return;
            setModel(m); setStaged(fresh(m)); setConflicts(m.conflicts || []);
          }).catch(() => {});
        }, []);
        useEffect(load, []);
        useEffect(() => { window.__llCapturing = !!capturing; }, [capturing]);
        useEffect(() => {
          fetch('http://127.0.0.1:6131/apps.json', { method: 'POST', cache: 'no-store' })
            .then(r => r.json()).then(list => { if (Array.isArray(list)) setApps(list.filter(a => a && a.name && a.path)); }).catch(() => {});
        }, []);

        const saved = model ? fresh(model) : { core: {}, apps: [], removed: [], tiling: {} };
        const dirty = model && JSON.stringify(staged) !== JSON.stringify(saved);
        const check = next => {
          const seq = ++checkSeq.current;
          helper(['--keybinds-check', JSON.stringify(next)]).then(s => {
            const r = json(s);
            if (r && r.ok && seq === checkSeq.current) setConflicts(r.conflicts || []);
          }).catch(() => {});
        };
        const stage = next => { setStaged(next); check(next); };

        const rows = [
          { key: 'super', group: 'sys', label: 'Arama / overview', combo: 'Super', fixed: true },
          { key: 'dock', group: 'sys', label: 'Uygulama Dock’u', combo: 'Super+Alt', fixed: true },
        ];
        if (model) {
          for (const b of model.core) {
            if (b.custom || staged.removed.includes(b.id)) continue;
            rows.push({ key: 'll:' + b.id, group: b.app ? 'app' : llGroup(b.id), label: llLabel(b.id), combo: b.id in staged.core ? staged.core[b.id] : b.combo, def: b.default, src: 'll', id: b.id, app: b.app });
          }
          for (const a of staged.apps) rows.push({ key: 'll:' + a.id, group: 'app', label: a.name, combo: a.combo, src: 'll', id: a.id, app: true, custom: true });
          for (const g of model.tiling) {
            const b = staged.tiling[g.index] || g.bindings;
            rows.push({ key: 'tiling:' + g.index, group: tilingGroup(g.commands), label: tilingLabel(g.commands), combo: b[0] || '', extra: b.slice(1), src: 'tiling', id: g.index });
          }
        }
        const conflictOf = key => conflicts.find(c => (c.keys || []).includes(key));
        const conflictText = (row, c) => c.reserved ? `Windows'a ayrılmış: ${c.reserved}`
          : 'Çakışıyor: ' + c.keys.filter(k => k !== row.key).map(k => (rows.find(r => r.key === k) || {}).label || k).join(', ');
        const shown = q ? rows.filter(r => low(r.label).includes(low(q)) || low(r.combo).includes(low(q))) : rows;

        // Satırın yeni tuşları bekleyen duruma girer
        const put = (row, combo) => {
          const next = { ...staged, core: { ...staged.core }, apps: staged.apps.map(a => ({ ...a })), tiling: { ...staged.tiling } };
          if (row.src === 'll') {
            const app = next.apps.find(a => a.id === row.id);
            if (app) app.combo = combo;
            else {
              const savedCombo = (model.core.find(b => b.id === row.id) || {}).combo || '';
              if (combo === savedCombo) delete next.core[row.id]; else next.core[row.id] = combo;
            }
          } else {
            const savedB = (model.tiling.find(g => g.index === row.id) || {}).bindings || [];
            const b = [...(next.tiling[row.id] || savedB)];
            if (!combo) b.shift(); else if (b.length) b[0] = combo; else b.push(combo);
            if (JSON.stringify(b) === JSON.stringify(savedB)) delete next.tiling[row.id]; else next.tiling[row.id] = b;
          }
          setMsg(null);
          stage(next);
        };
        const capture = async row => {
          if (locked || row.fixed || capturing) return;
          setMsg(null); setCapturing(row.key);
          let combo = '';
          try { combo = (await helper(['--capture'])).trim(); } catch {}
          setCapturing(null);
          if (combo) put(row, combo);
        };
        const captureNew = async (next, id) => {
          setCapturing('ll:' + id);
          let combo = '';
          try { combo = (await helper(['--capture'])).trim(); } catch {}
          setCapturing(null);
          if (!combo) return;
          const after = { ...next, apps: next.apps.map(a => (a.id === id ? { ...a, combo } : a)) };
          stage(after);
        };
        const addApp = (name, path) => {
          setPicker(false);
          const id = 'app:' + Date.now().toString(36);
          const next = { ...staged, apps: [...staged.apps, { id, name, path, combo: '' }] };
          stage(next);
          captureNew(next, id);
        };
        const browse = async () => {
          let r = null;
          try { r = json(await helper(['--keybinds-pick-app'])); } catch {}
          if (r && r.path) addApp(r.name || r.path, r.path);
        };
        const remove = row => {
          const next = row.custom
            ? { ...staged, apps: staged.apps.filter(a => a.id !== row.id) }
            : { ...staged, removed: [...staged.removed, row.id], core: Object.fromEntries(Object.entries(staged.core).filter(([k]) => k !== row.id)) };
          stage(next);
        };
        const refuse = () => {
          setShake(n => n + 1);
          const lines = conflicts.slice(0, 3).map(c => `${c.combo}: ${c.keys.map(k => (rows.find(r => r.key === k) || {}).label || k).join(', ')}${c.reserved ? ` (${c.reserved})` : ''}`);
          emit('ll:toast', { kind: 'error', icon: 'keyboard', title: 'Kısayollar kaydedilmedi: çakışma var', body: lines.join('\n'), timeout: 6000 }).catch(() => {});
        };
        const save = async () => {
          if (!dirty || busy) return;
          if (conflicts.length) return refuse();
          setBusy(true);
          let r = null;
          try { r = json(await helper(['--keybinds-save', JSON.stringify(staged)])); } catch {}
          setBusy(false);
          if (r && r.ok) {
            emit('ll:toast', { kind: 'ok', icon: 'keyboard', title: 'Kısayollar kaydedildi', timeout: 2500 }).catch(() => {});
            setMsg(null); load();
          } else if (r && r.conflicts && r.conflicts.length) { setConflicts(r.conflicts); refuse(); }
          else setMsg({ kind: 'error', text: 'Kısayollar kaydedilemedi' });
        };
        const doReset = async removeApps => {
          setReset(null); setBusy(true);
          let ok = false;
          try { ok = (json(await helper(removeApps ? ['--keybinds-reset', '--apps'] : ['--keybinds-reset'])) || {}).ok === true; } catch {}
          setBusy(false);
          setMsg(ok ? { kind: 'ok', text: 'Tüm kısayollar varsayılana döndü' } : { kind: 'error', text: 'Kısayollar sıfırlanamadı' });
          load();
        };
        // Eklenen uygulama varsa kabuğun tek diyaloğunda sorulur (POST /dialog); kabuk soramıyorsa sayfanın kendi kutusu
        const askReset = async () => {
          if (!saved.apps.length) return doReset(false);
          const tr = t => (window.LL_T ? window.LL_T(t) : t);
          const p = new URLSearchParams({ kind: 'question', title: tr('Kısayollar sıfırlansın mı?'), body: tr('Bütün kısayollar varsayılanlarına döner.'),
            buttons: [tr('Sıfırla'), tr('Vazgeç')].join('|'), default: '0', cancel: '1', check: tr('Kendi eklediğin uygulamalar da kaldırılsın'), checked: '0' });
          let a = null;
          try { a = await (await fetch('http://127.0.0.1:6131/dialog?' + p, { method: 'POST', cache: 'no-store' })).json(); } catch {}
          if (!a || a.button === -1) return setReset({ apps: false });
          if (a.button === 0) doReset(!!a.checked);
        };
        const pickList = pickQ ? apps.filter(a => low(a.name).includes(low(pickQ))) : apps;

        return (
          <Page title="Kısayollar" icon="keyboard" onClose={onClose} actions={<>
            <button className={`chip ${locked ? '' : 'on'}`} onClick={() => { setLocked(v => !v); setMsg(null); }}
                    title={locked ? 'Düzenlemeyi aç' : 'Salt okunur yap'}>
              <Icon name={locked ? 'lock' : 'lock_open'} />{locked ? 'Salt okunur' : 'Düzenleme'}
            </button>
          </>}>
            <div className="kb-tools">
              <div className="kb-search"><Icon name="search" /><input value={q} onChange={e => setQ(e.target.value)} placeholder="Kısayol ara" spellCheck={false} /></div>
              <button className="chip" disabled={locked} onClick={askReset} title="Varsayılanlara sıfırla"><Icon name="restart_alt" />Sıfırla</button>
            </div>
            {!locked && <div className="kb-hint"><Icon name="info" />Değiştirmek için bir satıra tıkla ve yeni tuşlara bas. Esc: iptal.</div>}
            {msg && <div className={`kb-msg ${msg.kind}`}><Icon name={msg.kind === 'ok' ? 'check_circle' : 'error'} />{msg.text}</div>}
            {GROUPS.map(([g, title, icon]) => {
              const list = shown.filter(r => r.group === g);
              const add = g === 'app' && !locked;
              if (!list.length && !add) return null;
              return (
                <div key={g} className="kb-group">
                  <div className="kb-gtitle"><Icon name={icon} />{title}</div>
                  {list.map(r => {
                    const c = capturing === r.key ? null : conflictOf(r.key);
                    return (
                      <div key={r.key} className={`kb-row ${locked || r.fixed ? '' : 'editable'} ${capturing === r.key ? 'capturing' : ''} ${c ? 'clash' : ''}`} onClick={() => capture(r)}>
                        <div className="kb-main">
                          <span className="kb-label">{r.label}</span>
                          {capturing === r.key
                            ? <span className="kb-wait"><Icon name="keyboard" />Tuşlara bas…</span>
                            : <Keycaps combo={r.combo} />}
                          {!locked && r.src === 'll' && r.def && r.combo !== r.def && capturing !== r.key && (
                            <button className="kb-mini" title={`Varsayılan: ${r.def}`} onClick={e => { e.stopPropagation(); put(r, r.def); }}><Icon name="undo" /></button>
                          )}
                          {!locked && !r.fixed && r.combo && capturing !== r.key && (
                            <button className="kb-mini" title="Kısayolu kaldır" onClick={e => { e.stopPropagation(); put(r, ''); }}><Icon name="close" /></button>
                          )}
                          {!locked && r.app && capturing !== r.key && (
                            <button className="kb-mini" title="Uygulamayı listeden kaldır" onClick={e => { e.stopPropagation(); remove(r); }}><Icon name="delete" /></button>
                          )}
                        </div>
                        {c && <div className="kb-clash"><Icon name="error" />{conflictText(r, c)}</div>}
                      </div>
                    );
                  })}
                  {add && <button className="kb-add" onClick={() => { setPickQ(''); setPicker(true); }}><Icon name="add" />Uygulama ekle</button>}
                </div>
              );
            })}
            {!locked && (
              <div className="kb-foot">
                {dirty && <span className={`kb-note ${conflicts.length ? 'err' : ''}`}>{conflicts.length ? 'Çakışan kısayollar var' : 'Kaydedilmemiş değişiklikler'}</span>}
                {dirty && <button className="chip" onClick={() => { setStaged(saved); check(saved); setMsg(null); }}>Vazgeç</button>}
                <button key={shake} className={`kb-save ${dirty ? 'on' : ''} ${dirty && conflicts.length ? 'err' : ''} ${shake && window.LL_PREFS?.animations !== false ? 'shake' : ''}`} onClick={save} disabled={!dirty || busy}>
                  <Icon name={dirty && conflicts.length ? 'error' : 'save'} />Kaydet
                </button>
              </div>
            )}
            {picker && (
              <div className="dlg-scrim" onClick={() => setPicker(false)}>
                <div className="dlg" onClick={e => e.stopPropagation()}>
                  <div className="dlg-head"><span className="dlg-title">Uygulama ekle</span></div>
                  <div className="kb-search"><Icon name="search" /><input autoFocus value={pickQ} onChange={e => setPickQ(e.target.value)} placeholder="Uygulama ara" spellCheck={false}
                    onKeyDown={e => { if (e.key === 'Escape') { e.stopPropagation(); setPicker(false); } }} /></div>
                  <div className="dlg-list">
                    {pickList.map(a => (
                      <button key={a.path} className="net-row" onClick={() => addApp(a.name, a.path)}><Icon name="apps" /><span className="net-name">{a.name}</span></button>
                    ))}
                    {!pickList.length && <div className="dlg-empty"><Icon name="info" />Uygulama bulunamadı</div>}
                  </div>
                  <div className="dlg-foot"><button className="chip" onClick={browse}><Icon name="folder_open" />Gözat…</button></div>
                </div>
              </div>
            )}
            {reset && (
              <div className="dlg-scrim" onClick={() => setReset(null)}>
                <div className="dlg kb-confirm" onClick={e => e.stopPropagation()}>
                  <div className="dlg-head"><span className="dlg-title">Kısayollar sıfırlansın mı?</span></div>
                  <p className="kb-confirm-text">Bütün kısayollar varsayılanlarına döner.</p>
                  <label className="kb-check"><input type="checkbox" checked={reset.apps} onChange={e => setReset({ apps: e.target.checked })} />Kendi eklediğin uygulamalar da kaldırılsın</label>
                  <div className="dlg-foot">
                    <button className="chip" onClick={() => setReset(null)}>Vazgeç</button>
                    <button className="chip on" onClick={() => doReset(reset.apps)}>Sıfırla</button>
                  </div>
                </div>
              </div>
            )}
          </Page>
        );
      }

      // ---- Duvar kağıtları ----
      const WALL_CATS = [['anime', 'Anime', 'animation'], ['nature', 'Doğa', 'forest'], ['space', 'Uzay', 'rocket'], ['city', 'Şehir', 'location_city'], ['minimal', 'Minimal', 'crop_square'], ['local', 'Kütüphanem', 'photo_library']];
      const wallCache = {};
      // Kategori satırı (bütün galeriler aynısını kullanır): tek satırda yana kayar; tekerlek (iki yönde de) ve
      // sürükleme kaydırır, gizli kalan taraf solup okla gösterilir, seçilen çip görünür alana getirilir.
      function CatRow({ children, selectedKey }) {
        const ref = useRef(null);
        const [ends, setEnds] = useState({ left: false, right: false });
        const drag = useRef(null);
        const measure = useCallback(() => {
          const el = ref.current;
          if (!el) return;
          const left = el.scrollLeft > 1, right = el.scrollLeft + el.clientWidth < el.scrollWidth - 1;
          setEnds(e => (e.left === left && e.right === right ? e : { left, right }));
        }, []);
        useLayoutEffect(() => {
          const el = ref.current;
          if (!el) return;
          const sel = el.querySelector('.chip.on');
          if (sel) {
            const pad = 34;
            if (sel.offsetLeft - pad < el.scrollLeft) el.scrollLeft = Math.max(0, sel.offsetLeft - pad);
            else if (sel.offsetLeft + sel.offsetWidth + pad > el.scrollLeft + el.clientWidth) el.scrollLeft = sel.offsetLeft + sel.offsetWidth + pad - el.clientWidth;
          }
          measure();
        }, [selectedKey, children?.length]);
        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const ro = new ResizeObserver(measure);
          ro.observe(el);
          return () => ro.disconnect();
        }, []);
        const step = dir => { const el = ref.current; if (el) el.scrollBy({ left: dir * el.clientWidth * 0.7, behavior: 'smooth' }); };
        const onWheel = e => { const el = ref.current; if (!el) return; el.scrollLeft += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; };
        // Sürükleme: birkaç pikselden sonra tıklama yerine kaydırır
        const onPointerDown = e => { if (e.button === 0) drag.current = { x: e.clientX, left: ref.current.scrollLeft, moved: false, id: e.pointerId }; };
        const onPointerMove = e => {
          const d = drag.current;
          if (!d) return;
          if (!d.moved && Math.abs(e.clientX - d.x) > 6) { d.moved = true; ref.current.setPointerCapture(d.id); }
          if (d.moved) ref.current.scrollLeft = d.left - (e.clientX - d.x);
        };
        const onPointerUp = () => { const d = drag.current; drag.current = null; if (d?.moved) { const stop = ev => { ev.stopPropagation(); ev.preventDefault(); }; window.addEventListener('click', stop, { capture: true, once: true }); setTimeout(() => window.removeEventListener('click', stop, { capture: true }), 0); } };
        return (
          <div className={`cat-row ${ends.left ? 'more-left' : ''} ${ends.right ? 'more-right' : ''}`}>
            <div className="cat-scroll" ref={ref} onScroll={measure} onWheel={onWheel}
                 onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp}>
              {children}
            </div>
            {ends.left && <button className="cat-arrow left" onClick={() => step(-1)}><Icon name="chevron_left" /></button>}
            {ends.right && <button className="cat-arrow right" onClick={() => step(1)}><Icon name="chevron_right" /></button>}
          </div>
        );
      }

      // preview: üzerine gelince oynayan önizleme (canlı duvar kağıtları); busyText: indirme ilerlemesi
      // actions: öğenin üzerine gelince görünen düğmeler [{ icon, label, run(it) }]
      function WallRow({ items, busy, busyText, onPick, onCustom, customLabel, customIcon, wide, selected, fallbackIcon, cls, actions, libraryKind, onRemoved, menuActions }) {
        const ref = useRef(null);
        const [hover, setHover] = useState(null);
        const [context, setContext] = useState(null);
        const openMenu = (e, it) => { e.preventDefault(); e.stopPropagation(); if (busy) return; const r = e.currentTarget.getBoundingClientRect(); setContext({ item: it, point: { x: e.clientX || r.left, y: e.clientY || r.bottom } }); };
        return (
          <div className={`wall-row ${wide ? 'wide' : ''} ${cls || ''}`} ref={ref}
               onWheel={e => { if (ref.current && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { ref.current.scrollLeft += e.deltaY; } }}>
            <button className="wall-tile custom" onClick={onCustom}>
              <Icon name={customIcon || 'add_photo_alternate'} /><span>{customLabel}</span>
            </button>
            {items === null && <div className="wall-tile ghost"><Icon name="progress_activity" /></div>}
            {items && items.length === 0 && <div className="wall-empty">Bir şey bulunamadı</div>}
            {items && items.map(it => (
              <button key={it.key} className={`wall-tile ${busy === it.key ? 'busy' : ''} ${selected === it.key ? 'sel' : ''}`} onClick={() => onPick(it)} title={it.res || it.name || ''}
                      onContextMenu={e => openMenu(e, it)} onKeyDown={e => { if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) openMenu(e, it); }}
                      onMouseEnter={it.preview ? () => setHover(it.key) : undefined} onMouseLeave={it.preview ? () => setHover(null) : undefined}>
                {it.thumb ? <img src={hover === it.key ? it.preview : it.thumb} alt="" loading="lazy" /> : <Icon name={fallbackIcon || 'movie'} />}
                {it.res && <span className="wall-res">{it.res}</span>}
                {it.label && <span className="wall-name">{it.label}</span>}
                {busy === it.key && <span className="wall-spin"><Icon name="progress_activity" />{busyText && <b>{busyText}</b>}</span>}
                {actions && !busy && (
                  <span className="wall-acts">
                    {actions.map(a => (
                      <span key={a.icon} role="button" className="wall-act" title={a.label}
                            onClick={e => { e.stopPropagation(); a.run(it); }}><Icon name={a.icon} /></span>
                    ))}
                  </span>
                )}
              </button>
            ))}
            {context && <GalleryMenu item={context.item} point={context.point} kind={libraryKind === 'saver' && !importedSaver(context.item.path) ? null : libraryKind}
              actions={menuActions ? menuActions(context.item) : [{ icon: 'check', label: 'Uygula', run: onPick }, ...(actions || []), ...(context.item.path ? [{ icon: 'folder_open', label: 'Dosya konumunu aç', run: it => lunge.shellSpawn('explorer', [`/select,${it.path}`]) }] : [])]}
              onClose={() => setContext(null)} onRemoved={onRemoved} />}
          </div>
        );
      }

      // ---- Canlı duvar kağıdı: video, masaüstü simgelerinin arkasında (lunge-wallpaper.exe) ----
      // Mağaza: Sucrose Store; çekirdek yalnızca güvenli içeriği listeler, yalnızca video türünü indirir
      const LIVE_CATS = {
        Anime: 'Anime', Game: 'Oyun', Vehicles: 'Taşıtlar', Landscape: 'Manzara', Lifestyle: 'Yaşam tarzı', Fantasy: 'Fantastik',
        'Film and TV': 'Film ve dizi', Abstract: 'Soyut', Animals: 'Hayvanlar', Nature: 'Doğa', 'Science Fiction': 'Bilim kurgu',
        Retro: 'Retro', Ambience: 'Atmosfer', Galaxy: 'Galaksi', Space: 'Uzay', Technology: 'Teknoloji',
      };
      const liveCache = new Map();
      // Çekirdeğin hata kodları; ağ hataları Windows'un kendi metniyle gelir
      const LIVE_ERRORS = { type: 'Bu duvar kağıdı video değil', size: 'Video çok büyük', decode: 'Bu video oynatılamıyor' };
      const liveError = (e, download) => (Object.hasOwn(LIVE_ERRORS, e || '') ? LIVE_ERRORS[e] : download ? 'İndirilemedi' : 'Canlı duvar kağıdı ayarlanamadı');
      const liveCatName = id => (Object.hasOwn(LIVE_CATS, id) ? LIVE_CATS[id] : id);
      // Kütüphane ('local') ya da mağaza kategorisi: canlı duvar kağıdı ve video ekran koruyucusu aynı listeyi kullanır
      const fetchLiveItems = async c => {
        if (c === 'local') {
          const files = json(await helper(['--live-local']).catch(() => '[]'));
          const out = [];
          for (const f of (Array.isArray(files) ? files : [])) {
            const t = f.thumb ? await helper(['--wall-thumb', f.thumb]).catch(() => '') : '';
            out.push({ key: f.path, path: f.path, name: f.author ? `${f.name} · ${f.author}` : f.name, thumb: t.startsWith('data:') ? t : '' });
          }
          return out; // yerel liste önbelleğe alınmaz (yeni eklenenler görünsün)
        }
        if (liveCache.has(c)) return liveCache.get(c);
        const r = json(await helper(['--live-store', c]).catch(() => ''));
        if (!Array.isArray(r)) return [];
        const list = r.map(x => ({ key: `${c}/${x.id}`, cat: c, id: x.id, name: x.title, thumb: x.cover, preview: x.preview }));
        liveCache.set(c, list);
        return list;
      };
      function LiveSection({ target, mons, options, onChanged }) {
        const [msg, setMsg] = useState(null);
        const [cats, setCats] = useState([]);
        const [cat, setCat] = useState(load('ll.live.cat', 'Anime'));
        const [items, setItems] = useState(null);
        const [busy, setBusy] = useState(null);
        const [progress, setProgress] = useState('');
        const [opts, setOpts] = useState({ pauseFullscreen: true, pauseOnBattery: true });
        const polling = useRef(false);
        useEffect(() => { if (options) setOpts(options); }, [options?.pauseFullscreen, options?.pauseOnBattery]);
        useEffect(() => {
          helper(['--live-store']).then(s => {
            const r = json(s);
            if (Array.isArray(r)) setCats(r);
            else { setCats([]); setMsg({ kind: 'error', text: 'Mağazaya ulaşılamadı' }); }
          }).catch(() => setCats([]));
        }, []);

        const fetchItems = fetchLiveItems;
        useEffect(() => {
          let alive = true;
          setItems(null); save('ll.live.cat', cat);
          fetchItems(cat).then(r => alive && setItems(r));
          return () => { alive = false; };
        }, [cat]);

        const done = text => { setMsg({ kind: 'ok', text }); onChanged(); };
        // Mağazadan indirirken ilerleme: çekirdek Live\.progress'e yazar
        // bir seferde bir indirme; ilerleme sorusu bir öncekinin cevabını bekler (her biri bir süreç)
        const apply = async (it, mode = target) => {
          if (busy) return;
          setBusy(it.key); setProgress(''); setMsg(null);
          const timer = it.path ? null : setInterval(() => {
            if (polling.current) return;
            polling.current = true;
            helper(['--live-progress']).then(s => {
              const p = json(s);
              if (p && p.total > 0) setProgress(`${Math.round((p.got * 100) / p.total)}%`);
              else if (p && p.got > 0) setProgress(`${Math.round(p.got / 1048576)} MB`);
            }).catch(() => {}).finally(() => { polling.current = false; });
          }, 800);
          const r = json(it.path ? await helper(['--live-set', it.path, mode]).catch(() => '')
            : await helper(['--live-get', it.cat, it.id, mode]).catch(() => '')) || {};
          clearInterval(timer); setBusy(null); setProgress('');
          if (r.ok) done('Canlı duvar kağıdı ayarlandı'); else setMsg({ kind: 'error', text: liveError(r.error, !it.path) });
        };
        const pick = () => helper(['--live-pick', target]).then(s => {
          const r = json(s);
          if (typeof r === 'string' && r) { done('Canlı duvar kağıdı ayarlandı'); if (cat === 'local') fetchItems('local').then(setItems); }
          else if (r && r.error) setMsg({ kind: 'error', text: liveError(r.error) });
        }).catch(() => {});
        const clear = async () => {
          setMsg(null);
          const r = json(await helper(['--live-clear', target]).catch(() => '')) || {};
          if (r.ok) done('Canlı duvar kağıdı kapatıldı'); else setMsg({ kind: 'error', text: liveError(r.error) });
        };
        const setOpt = async part => {
          const prev = opts, next = { ...opts, ...part };
          setOpts(next);
          const r = json(await helper(['--live-options', next.pauseFullscreen ? '1' : '0', next.pauseOnBattery ? '1' : '0']).catch(() => '')) || {};
          if (!r.ok) { setOpts(prev); setMsg({ kind: 'error', text: 'Ayar kaydedilemedi' }); }
        };
        const on = mons.some(m => m.live && (target === 'all' || m.id === target));
        // Tek mağaza: her video ekran koruyucu da olabilir (mağazadakiler önce kütüphaneye iner)
        const makeSaver = async it => {
          if (busy) return;
          setBusy(it.key); setProgress(''); setMsg(null);
          const timer = it.path ? null : setInterval(() => {
            if (polling.current) return;
            polling.current = true;
            helper(['--live-progress']).then(s => {
              const p = json(s);
              if (p && p.total > 0) setProgress(`${Math.round((p.got * 100) / p.total)}%`);
            }).catch(() => {}).finally(() => { polling.current = false; });
          }, 800);
          const r = json(it.path ? await helper(['--saver-video', 'set', it.path]).catch(() => '')
            : await helper(['--saver-store-get', it.cat, it.id]).catch(() => '')) || {};
          clearInterval(timer); setBusy(null); setProgress('');
          if (Array.isArray(r.videos)) { setMsg({ kind: 'ok', text: 'Ekran koruyucu videosu ayarlandı' }); window.dispatchEvent(new Event('ll-saver-videos')); }
          else setMsg({ kind: 'error', text: Object.hasOwn(SAVER_ERRORS, r.error || '') ? SAVER_ERRORS[r.error] : it.path ? 'Ekran koruyucu ayarlanamadı' : 'İndirilemedi' });
        };
        const actions = [{ icon: 'ambient_screen', label: 'Ekran koruyucu yap', run: makeSaver }];

        return (
          <div className="wall-sec">
            <div className="kb-gtitle"><Icon name="motion_photos_on" />Canlı duvar kağıdı ve mağaza</div>
            <div className="kb-hint"><Icon name="info" />Video, masaüstü simgelerinin arkasında oynar. Mağazadaki her video canlı duvar kâğıdı ya da ekran koruyucu olabilir; indirilen video iki yerde de kütüphanende durur.</div>
            {msg && <div className={`kb-msg ${msg.kind}`}><Icon name={msg.kind === 'ok' ? 'check_circle' : 'error'} />{msg.text}</div>}
            <CatRow selectedKey={cat}>
              <button className={`chip ${cat === 'local' ? 'on' : ''}`} onClick={() => setCat('local')}><Icon name="video_library" />Kütüphanem</button>
              {cats.map(c => (
                <button key={c.id} className={`chip ${cat === c.id ? 'on' : ''}`} onClick={() => setCat(c.id)}>{liveCatName(c.id)}</button>
              ))}
            </CatRow>
            <WallRow items={items} busy={busy} busyText={progress} customLabel="Video ya da paket içe aktar" customIcon="video_file" onCustom={pick} onPick={apply} actions={actions} libraryKind="live"
              menuActions={it => [
                ...(!it.path ? [{ icon: 'download', label: 'İndir', run: async () => { const r = json(await helper(['--live-get', it.cat, it.id, 'none'])); if (!r?.ok) throw new Error(liveError(r?.error, true)); } }] : []),
                { icon: 'check', label: 'Uygula (tüm monitörler)', run: () => apply(it, 'all') },
                ...(mons.length > 1 ? [{ icon: 'desktop_windows', label: 'Bu monitöre uygula', children: mons.map((m, i) => ({ icon: 'desktop_windows', label: `Monitör ${i + 1}`, run: () => apply(it, m.id) })) }] : []),
                ...actions,
                ...(it.path ? [{ icon: 'folder_open', label: 'Dosya konumunu aç', run: () => lunge.shellSpawn('explorer', [`/select,${it.path}`]) }] : []),
              ]}
              onRemoved={async it => { await helper(['--saver-video', 'remove', it.path]); setItems(await fetchItems(cat)); onChanged(); window.dispatchEvent(new Event('ll-saver-videos')); }} />
            <div className="kb-hint"><Icon name="info" />İndirdiğin videoyu, Lively (.zip) ya da Wallpaper Engine video paketini (.zip ya da project.json) içe aktarabilirsin.</div>
            <div className="live-foot">
              {on && <button className="chip" onClick={clear}><Icon name="stop_circle" />Canlı duvar kağıdını kapat</button>}
              <label className="saver-switch"><span>Tam ekran uygulamada duraklat</span>
                <input type="checkbox" checked={opts.pauseFullscreen} onChange={e => setOpt({ pauseFullscreen: e.target.checked })} /></label>
              <label className="saver-switch"><span>Pille çalışırken duraklat</span>
                <input type="checkbox" checked={opts.pauseOnBattery} onChange={e => setOpt({ pauseOnBattery: e.target.checked })} /></label>
            </div>
          </div>
        );
      }

      function WallpaperPage({ onClose }) {
        const [info, setInfo] = useState(null);
        const [target, setTarget] = useState('all');
        const [cat, setCat] = useState(load('ll.wall.cat', 'anime'));
        const [items, setItems] = useState(null);
        const [spanItems, setSpanItems] = useState(null);
        const [busy, setBusy] = useState(null);
        const [msg, setMsg] = useState(null);
        const loadInfo = () => helper(['--wall-info']).then(s => { const r = json(s); if (r && r.monitors) setInfo(r); }).catch(() => {});
        useEffect(() => { loadInfo(); }, []);

        const fetchCat = async c => {
          if (wallCache[c]) return wallCache[c];
          if (c === 'local') {
            const files = json(await helper(['--wall-local']).catch(() => '[]')) || [];
            const out = [];
            for (const f of files) {
              const t = await helper(['--wall-thumb', f.path]).catch(() => '');
              out.push({ key: f.path, thumb: t.startsWith('data:') ? t : '', path: f.path, name: f.name });
            }
            return out; // yerel liste önbelleğe alınmaz (yeni eklenenler görünsün)
          }
          const r = json(await helper(['--wall-browse', c]).catch(() => '[]')) || [];
          return (wallCache[c] = r.map(x => ({ key: x.id, thumb: x.thumb, full: x.full, res: x.res })));
        };
        useEffect(() => { let alive = true; setItems(null); save('ll.wall.cat', cat); fetchCat(cat).then(r => alive && setItems(r)); return () => { alive = false; }; }, [cat]);
        const multi = (info?.monitors?.length || 0) > 1;
        useEffect(() => { if (multi) fetchCat('span').then(setSpanItems); }, [multi]);

        const applyItem = async (it, mode) => {
          setBusy(it.key); setMsg(null);
          const r = json(it.path ? await helper(['--wall-set', it.path, mode]).catch(() => '') : await helper(['--wall-get', it.full, mode]).catch(() => '')) || {};
          setBusy(null);
          if (r.error) setMsg({ kind: 'error', text: r.error }); else { setMsg({ kind: 'ok', text: 'Duvar kağıdı ayarlandı' }); loadInfo(); }
        };
        const custom = mode => helper(['--wall-pick', mode]).then(() => loadInfo()).catch(() => {});
        const wallMenu = (it, span = false) => [
          ...(!it.path ? [{ icon: 'download', label: 'İndir', run: async () => { const r = json(await helper(['--wall-download', it.full])); if (!r?.ok) throw new Error(r?.error || 'İndirilemedi'); } }] : []),
          { icon: 'check', label: span ? 'Uygula' : 'Uygula (tüm monitörler)', run: () => applyItem(it, span ? 'span' : 'all') },
          ...(!span && info?.monitors?.length > 1 ? [{ icon: 'desktop_windows', label: 'Bu monitöre uygula', children: info.monitors.map((m, i) => ({ icon: 'desktop_windows', label: `Monitör ${i + 1}`, run: () => applyItem(it, m.id) })) }] : []),
          ...(it.path ? [{ icon: 'folder_open', label: 'Dosya konumunu aç', run: () => lunge.shellSpawn('explorer', [`/select,${it.path}`]) }] : []),
        ];

        // Monitör yerleşimi (Windows ekran ayarları gibi küçük harita)
        const mons = info?.monitors || [];
        const minX = Math.min(...mons.map(m => m.x), 0), minY = Math.min(...mons.map(m => m.y), 0);
        const maxX = Math.max(...mons.map(m => m.x + m.w), 1), maxY = Math.max(...mons.map(m => m.y + m.h), 1);
        const sc = Math.min(360 / (maxX - minX), 90 / (maxY - minY));

        return (
          <Page title="Duvar kağıtları" icon="wallpaper" onClose={onClose}>
            {msg && <div className={`kb-msg ${msg.kind}`}><Icon name={msg.kind === 'ok' ? 'check_circle' : 'error'} />{msg.text}</div>}
            <div className="wall-sec">
              <div className="kb-gtitle"><Icon name="desktop_windows" />Her monitöre</div>
              {mons.length > 0 && (
                <div className="mon-map" style={{ height: (maxY - minY) * sc + 8 }}>
                  {mons.map((m, i) => (
                    <button key={m.id} className={`mon ${target === 'all' || target === m.id ? 'sel' : ''}`}
                            style={{ left: (m.x - minX) * sc, top: (m.y - minY) * sc, width: m.w * sc - 4, height: m.h * sc - 4 }}
                            onClick={() => setTarget(t => (t === m.id ? 'all' : m.id))} title={`${m.w}×${m.h}`}>
                      <span>{i + 1}</span>
                    </button>
                  ))}
                </div>
              )}
              <div className="wall-target">
                <button className={`chip ${target === 'all' ? 'on' : ''}`} onClick={() => setTarget('all')}><Icon name="select_all" />Tümü</button>
                {mons.map((m, i) => (
                  <button key={m.id} className={`chip ${target === m.id ? 'on' : ''}`} onClick={() => setTarget(m.id)}>{`Monitör ${i + 1}`}</button>
                ))}
              </div>
              <CatRow selectedKey={cat}>
                {WALL_CATS.map(([k, label, icon]) => (
                  <button key={k} className={`chip ${cat === k ? 'on' : ''}`} onClick={() => setCat(k)}><Icon name={icon} />{label}</button>
                ))}
              </CatRow>
              <WallRow items={items} busy={busy} customLabel="Dosyadan seç" onCustom={() => custom(target)} onPick={it => applyItem(it, target)} libraryKind="wall" menuActions={wallMenu} onRemoved={async () => { setItems(await fetchCat(cat)); loadInfo(); }} />
            </div>
            <LiveSection target={target} mons={mons} options={info?.liveOptions} onChanged={loadInfo} />
            {multi && (
              <div className="wall-sec">
                <div className="kb-gtitle"><Icon name="panorama_wide_angle" />Superscreen · tüm monitörlere yayılan tek resim</div>
                <div className="kb-hint"><Icon name="info" />Ultra geniş (32:9) öneriler; resim monitörlerin gerçek yerleşimine göre bölünür.</div>
                <WallRow wide items={spanItems} busy={busy} customLabel="Dosyadan seç" onCustom={() => custom('span')} onPick={it => applyItem(it, 'span')} menuActions={it => wallMenu(it, true)} />
              </div>
            )}
            <ScreenSaverSection />
            <div className="wall-credit">Öneriler: wallhaven.cc (yalnızca güvenli içerik)</div>
            <div className="wall-credit">Videolar: Sucrose Store (yalnızca güvenli içerik)</div>
          </Page>
        );
      }

      // Ekran koruyucu: her değişiklik hemen Windows'a yazılır. Panel odak kaybında kapanır; ayrı bir "Uygula" adımı
      // (ve tarayıcının kendi penceresinde açılan <select> listesi) seçimin kaybolmasına yol açıyordu.
      // ---- Video ekran koruyucusu: canlı duvar kağıdı kütüphanesinden ya da mağazasından bir video (LogicalLunge.scr) ----
      const SAVER_ERRORS = { library: 'Bu video ekran koruyucu olamaz', video: 'Bu video ekran koruyucu olamaz', scr: 'Video ekran koruyucusu kurulu değil', type: 'Bu duvar kağıdı video değil', size: 'Video çok büyük' };
      function SaverVideos({ onChanged }) {
        const [items, setItems] = useState(null);
        const [videos, setVideos] = useState([]);
        const [busy, setBusy] = useState(null);
        const [msg, setMsg] = useState(null);
        const reload = useCallback(() => {
          fetchLiveItems('local').then(setItems);
          helper(['--saver-videos']).then(s => { const r = json(s); if (r && Array.isArray(r.videos)) setVideos(r.videos); }).catch(() => {});
        }, []);
        useEffect(() => {
          reload();
          // mağazadan ya da canlı duvar kâğıtlarından "Ekran koruyucu yap"
          const on = () => { reload(); onChanged(); };
          window.addEventListener('ll-saver-videos', on);
          return () => window.removeEventListener('ll-saver-videos', on);
        }, []);
        const pick = async it => {
          if (busy) return;
          setBusy(it.key); setMsg(null);
          const r = json(await helper(['--saver-video', 'set', it.path]).catch(() => '')) || {};
          setBusy(null);
          if (Array.isArray(r.videos)) { setVideos(r.videos); setMsg({ kind: 'ok', text: 'Ekran koruyucu videosu ayarlandı' }); onChanged(); }
          else setMsg({ kind: 'error', text: Object.hasOwn(SAVER_ERRORS, r.error || '') ? SAVER_ERRORS[r.error] : 'Ekran koruyucu ayarlanamadı' });
        };
        const show = () => helper(['--saver-video-run']).then(s => { const r = json(s); if (r && r.error) setMsg({ kind: 'error', text: SAVER_ERRORS[r.error] || 'Ekran koruyucu açılamadı' }); }).catch(() => {});
        const chosen = items && items.find(it => it.path && videos.some(v => v.toLowerCase() === it.path.toLowerCase()));
        const playlist = async (op, it) => {
          const r = json(await helper(['--saver-video', op, it.path]));
          if (!Array.isArray(r?.videos)) throw new Error(SAVER_ERRORS[r?.error] || 'Ekran koruyucu ayarlanamadı');
          setVideos(r.videos); onChanged(); window.dispatchEvent(new Event('ll-saver-videos'));
        };
        return (
          <div className="saver-videos">
            <div className="kb-gtitle"><Icon name="movie" />Video ekran koruyucusu</div>
            <div className="kb-hint"><Icon name="info" />Canlı duvar kâğıdı kütüphanendeki videolar ekran koruyucu olarak oynar. Yenilerini Mağaza'dan indirebilirsin; birden çoksa karışık oynatılabilir.</div>
            {msg && <div className={`kb-msg ${msg.kind}`}><Icon name={msg.kind === 'ok' ? 'check_circle' : 'error'} />{msg.text}</div>}
            <WallRow items={items} busy={busy} selected={chosen ? chosen.key : null}
                     menuActions={it => { const listed = videos.some(v => v.toLowerCase() === it.path.toLowerCase()); return [
                       { icon: 'ambient_screen', label: 'Ekran koruyucu yap', run: () => playlist('set', it) },
                       { icon: 'playlist_add', label: 'Listeye ekle', disabled: listed, run: () => playlist('add', it) },
                       { icon: 'playlist_remove', label: 'Listeden çıkar', disabled: !listed, run: () => playlist('remove', it) },
                       { icon: 'play_arrow', label: 'Şimdi göster', run: async () => { const r = json(await helper(['--saver-video-run'])); if (!r?.ok) throw new Error(SAVER_ERRORS[r?.error] || 'Ekran koruyucu açılamadı'); } },
                     ]; }}
                     customLabel="Şimdi göster" customIcon="play_arrow" onCustom={show} onPick={pick} />
          </div>
        );
      }

      function ScreenSaverSection() {
        const [state, setState] = useState(null);
        const [saving, setSaving] = useState(false);
        const [error, setError] = useState('');
        const latest = useRef(null);
        latest.current = state;
        const minutesTimer = useRef(null);
        useEffect(() => {
          let alive = true;
          invoke('screensaver_state').then(s => { if (alive) setState(s); })
            .catch(e => { if (alive) setError(String(e)); });
          return () => { alive = false; clearTimeout(minutesTimer.current); };
        }, []);
        const apply = async next => {
          setState(next); setSaving(true); setError('');
          try {
            setState(await invoke('screensaver_set', {
              enabled: next.enabled, minutes: Number(next.minutes), secure: next.secure, selected: next.selected,
            }));
          } catch (e) {
            setError(String(e));
            invoke('screensaver_state').then(setState).catch(() => {}); // ekranda Windows'taki gerçek değer kalsın
          } finally { setSaving(false); }
        };
        const change = part => apply({ ...latest.current, ...part });
        // Yazarken her tuşta kaydetmesin: son değer yarım saniye sonra
        const changeMinutes = value => {
          setState(s => ({ ...s, minutes: value }));
          clearTimeout(minutesTimer.current);
          const minutes = Math.max(1, Math.min(120, parseInt(value, 10) || 1));
          minutesTimer.current = setTimeout(() => apply({ ...latest.current, minutes }), 500);
        };
        const run = configure => invoke('screensaver_run', { path: state.selected, configure }).catch(e => setError(String(e)));
        // Kart simgeleri (çekirdek .scr dosyalarının kendi simgelerini verir); içe aktarma sonrası yeniden
        const [icons, setIcons] = useState({});
        const [note, setNote] = useState('');
        const loadIcons = () => helper(['--saver-icons']).then(s => { const r = json(s); if (r && !r.error) setIcons(r); }).catch(() => {});
        useEffect(() => { loadIcons(); }, []);
        const importSavers = async () => {
          setError(''); setNote('');
          const r = json(await helper(['--saver-pick']).catch(() => '')) || {};
          if (r.error) { setError(r.error === 'noscr' ? 'Pakette ekran koruyucu (.scr) yok' : r.error === 'size' ? 'Paket çok büyük' : 'İçe aktarılamadı'); return; }
          const added = Array.isArray(r.added) ? r.added : [];
          if (!added.length) return;
          setNote(`${added.length} ekran koruyucu eklendi`);
          loadIcons();
          const s = await invoke('screensaver_state').catch(() => null);
          if (s) setState(s);
        };
        return (
          <div className="wall-sec saver-sec">
            <div className="kb-gtitle"><Icon name="screensaver" />Ekran koruyucu
              {saving && <span className="saver-saving"><Icon name="progress_activity" /></span>}</div>
            {!state && !error && <div className="kb-hint">Windows ayarları okunuyor…</div>}
            {state && <>
              <label className="saver-switch"><span>Etkin</span><input type="checkbox" checked={state.enabled}
                onChange={e => change({ enabled: e.target.checked, selected: state.selected || state.choices[0]?.path || '' })} /></label>
              <WallRow cls="saver-row-tiles" fallbackIcon="screensaver" selected={state.selected} customLabel="İçe aktar" customIcon="upload_file"
                       onCustom={importSavers} onPick={it => change({ selected: it.key })} libraryKind="saver"
                       menuActions={() => [{ icon: 'play_arrow', label: 'Önizle', run: it => invoke('screensaver_run', { path: it.path, configure: false }) }, { icon: 'tune', label: 'Ayarlar', run: it => invoke('screensaver_run', { path: it.path, configure: true }) }, { icon: 'check', label: 'Seç', run: it => change({ enabled: true, selected: it.path }) }]}
                       onRemoved={async it => { if (state.selected.toLowerCase() === it.path.toLowerCase()) await invoke('screensaver_set', { enabled: false, minutes: Number(state.minutes), secure: state.secure, selected: '' }); setState(await invoke('screensaver_state')); loadIcons(); }}
                       items={state.choices.map(c => ({ key: c.path, path: c.path, name: c.name, label: c.name, thumb: icons[c.path.toLowerCase()] || '' }))} />
              {note && <div className="kb-msg ok"><Icon name="check_circle" />{note}</div>}
              <SaverVideos onChanged={() => invoke('screensaver_state').then(setState).catch(() => {})} />
              <div className="saver-row">
                <span>Bekleme süresi</span>
                <span className="saver-minutes"><input type="number" min="1" max="120" value={state.minutes}
                  onChange={e => changeMinutes(e.target.value)} /> dakika</span>
              </div>
              <label className="saver-switch"><span>Dönüşte oturum açma iste</span><input type="checkbox" checked={state.secure}
                onChange={e => change({ secure: e.target.checked })} /></label>
              <div className="saver-actions">
                <button className="chip" disabled={!state.selected} onClick={() => run(false)}><Icon name="play_arrow" />Önizle</button>
                <button className="chip" disabled={!state.selected} onClick={() => run(true)}><Icon name="tune" />Seçenekler</button>
              </div>
            </>}
            {error && <div className="kb-msg error"><Icon name="error" />{error}</div>}
          </div>
        );
      }

      // ---- SystemButtonRow: "Çalışma süresi 1d, 31m" + düzenle / ayarlar / oturum ----
      function formatUptime(ms) {
        const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
        if (d) return `${d}d, ${h % 24}h`;
        if (h) return `${h}h, ${m % 60}m`;
        return `${m}m`;
      }

      let setEditModeGlobal = () => {};
      function SystemButtonRow({ host, onPage }) {
        return (
          <>
            <div className="sysrow">
              <div className="uptime">
                <svg viewBox="0 0 24 24" className="distro"><path fill="currentColor" d="M3 5.5 10 4.5v7H3zM11 4.4 21 3v8.5H11zM3 12.5h7v7l-7-1zM11 12.5h10V21l-10-1.4z"/></svg>
                <span className="up-txt">
                  <span className="up-lbl">Çalışma süresi</span>
                  <span className="up-val">{host ? formatUptime(host.uptime).replace(/,\s*/g, ' ') : '…'}</span>
                </span>
              </div>
              <div className="btngroup">
                <button className="qbtn" title="Güncellemeleri denetle" onClick={() => { emit('ll:update-check').catch(() => {}); emit('ll:sidebar-right-toggle').catch(() => {}); }}>
                  <Icon name="system_update_alt" />
                </button>
                <button className="qbtn" title="Duvar kağıtları" onClick={() => onPage('walls')}>
                  <Icon name="wallpaper" />
                </button>
                <button className="qbtn" title="Kısayollar" onClick={() => onPage('keys')}>
                  <Icon name="keyboard" />
                </button>
                <button className="qbtn" title="Hata raporu" onClick={() => onPage('bug')}><Icon name="bug_report" /></button>
                <button className="qbtn" title="Ayarlar" onClick={() => { emit('ll:sidebar-right-toggle').catch(() => {}); setTimeout(() => emit('ll:settings-toggle').catch(() => {}), 150); }}>
                  <Icon name="settings" />
                </button>
                <button className="qbtn" title="Oturum" onClick={() => { emit('ll:sidebar-right-toggle').catch(() => {}); setTimeout(() => emit('ll:session-toggle').catch(() => {}), 150); }}>
                  <Icon name="power_settings_new" />
                </button>
              </div>
            </div>
          </>
        );
      }

      // ii sessionScreen: kilitle / uyku / çıkış / yeniden başlat / kapat
      function SessionRow() {
        const act = (prog, args) => lunge.shellSpawn(prog, args);
        const items = [
          ['lock', 'Kilitle', () => act('rundll32', ['user32.dll,LockWorkStation'])],
          ['dark_mode', 'Uyku', () => act('rundll32', ['powrprof.dll,SetSuspendState', '0,1,0'])],
          // Takılan / kapanan bir parça varsa masaüstünü (pencere yöneticisi, kabuk, çekirdek) temiz baştan başlatır
          ['refresh', 'Yenile', () => act(HELPER, ['--restart-desktop'])],
          ['logout', 'Çıkış', () => act('shutdown', ['/l'])],
          ['restart_alt', 'Yeniden', () => act('shutdown', ['/r', '/t', '0'])],
          ['power_settings_new', 'Kapat', () => act('shutdown', ['/s', '/t', '0'])],
        ];
        return (
          <div className="session">
            {items.map(([ic, label, fn]) => (
              <button key={ic} className="session-btn" onClick={fn} title={label}><Icon name={ic} /><span>{label}</span></button>
            ))}
          </div>
        );
      }

      // ---- AndroidQuickPanel + AndroidQuickToggleButton ----
      const COLUMNS = 5, CELL_H = 56, SPACING = 6, PADDING = 6;
      const DEFAULT_TOGGLES = [
        { type: 'wifi', size: 2 }, { type: 'ethernet', size: 2 }, { type: 'idleInhibitor', size: 1 },
        { type: 'mic', size: 1 }, { type: 'bluetooth', size: 2 }, { type: 'audio', size: 2 },
        { type: 'nightLight', size: 2 },
      ];
      const AVAILABLE = ['wifi', 'ethernet', 'bluetooth', 'idleInhibitor', 'nightLight', 'darkMode', 'screenSnip', 'onScreenKeyboard', 'mic', 'audio', 'notifications'];

      // Eski kayıtlı düzende tek "network" kutucuğu vardı: Wi-Fi + Ethernet'e böl
      function loadToggles() {
        let t = load('ll.quickToggles', DEFAULT_TOGGLES);
        const before = JSON.stringify(t);
        const i = t.findIndex(x => x.type === 'network');
        if (i >= 0) t = [...t.slice(0, i), { type: 'wifi', size: 2 }, { type: 'ethernet', size: 2 }, ...t.slice(i + 1)];
        t = t.filter(x => AVAILABLE.includes(x.type));
        if (JSON.stringify(t) !== before) save('ll.quickToggles', t);
        return t;
      }

      function rowsFor(list) {
        const rows = []; let row = [], total = 0;
        for (const t of list) {
          if (total + t.size > COLUMNS) { rows.push(row); row = []; total = 0; }
          row.push(t); total += t.size;
        }
        if (row.length) rows.push(row);
        return rows;
      }

      // Kutucukların panel içindeki yeri (rowsFor + satır içinde boyutla esneme): sürüklenen kutucuğun bırakılacağı sıra
      // DOM ölçmeden hesaplanır (yerleşim belirli: her satır COLUMNS birim, kutucuk boyutuyla esner)
      function rectsFor(list, width) {
        const out = new Map();
        rowsFor(list).forEach((row, ri) => {
          const units = row.reduce((n, t) => n + t.size, 0);
          const free = width - SPACING * (row.length - 1);
          let x = 0;
          for (const t of row) {
            const w = free * t.size / units;
            out.set(t.type, { x, y: ri * (CELL_H + SPACING), w, h: CELL_H });
            x += w + SPACING;
          }
        });
        return out;
      }
      // Bırakılacak sıra: boşluğun ortası imlece en yakın olan konum
      function dropIndex(list, item, px, py, width) {
        const rest = list.filter(t => t.type !== item.type);
        let best = 0, bestD = Infinity;
        for (let i = 0; i <= rest.length; i++) {
          const r = rectsFor([...rest.slice(0, i), item, ...rest.slice(i)], width).get(item.type);
          const d = (r.x + r.w / 2 - px) ** 2 + (r.y + r.h / 2 - py) ** 2;
          if (d < bestD) { bestD = d; best = i; }
        }
        return best;
      }

      const signalIcon = s => (s >= 75 ? 'signal_wifi_4_bar' : s >= 50 ? 'network_wifi_3_bar' : s >= 25 ? 'network_wifi_2_bar' : 'network_wifi_1_bar');
      const openSettings = uri => lunge.shellSpawn('explorer', [uri]);

      let awakeRestarted = false;
      function AndroidQuickPanel({ o, open }) {
        const [toggles, setToggles] = useState(loadToggles);
        const [edit, setEdit] = useState(false);
        const [menu, setMenu] = useState(null); // kutucuğun altında kayarak açılan kart: 'wifi' | 'ethernet' | 'bluetooth'
        // Son bilinen donanım durumu önbellekten: panel açılınca kutucuklar yerinde hazır gelir, sonradan belirmez
        const [st, setSt] = useState(() => ({ radios: {}, eth: null, bt: null, awake: false, mic: null, ...load('ll.qs.cache', {}), theme: window.llTheme?.get() ?? 'dark', dnd: load('ll.dnd', false) }));
        setEditModeGlobal = setEdit;
        useEffect(() => { if (!open) setMenu(null); }, [open]);
        useEffect(() => { save('ll.qs.cache', { radios: st.radios, eth: st.eth, bt: st.bt, awake: st.awake, mic: st.mic }); }, [st.radios, st.eth, st.bt, st.awake, st.mic]);
        const panelRef = useRef(null);

        const refresh = useCallback(() => {
          qs('radios').then(s => { const r = json(s); if (r) setSt(x => ({ ...x, radios: r })); }).catch(() => {});
          qs('eth').then(s => { const r = json(s); if (r) setSt(x => ({ ...x, eth: r })); }).catch(() => {});
          qs('bt').then(s => { const r = json(s); if (r) setSt(x => ({ ...x, bt: r })); }).catch(() => {});
          helper(['--nightlight', 'status']).then(s => { const r = json(s); if (r) setSt(x => ({ ...x, night: r })); }).catch(() => {});
          qs('status').then(s => {
            const r = json(s); if (!r) return;
            // Yeniden başlatmadan sonra: açık bırakılmışsa uyanık tutmayı yeniden başlat
            if (!r.awake && load('ll.awake.want', false) && !awakeRestarted) {
              awakeRestarted = true;
              qs('awake?v=1').catch(() => {});
              r.awake = true;
            }
            setSt(x => ({ ...x, awake: !!r.awake }));
          }).catch(() => {});
          helper(['--mic', 'status']).then(s => { const r = json(s); if (r) setSt(x => ({ ...x, mic: !r.muted })); }).catch(() => {});
        }, []);
        // Açılışta (panel gizliyken) bir kez ve açılınca tazele: her tazeleme çekirdeğe dört istek ve iki süreç, art arda açıp
        // kapatınca birikmesin diye en çok 30 sn'de bir (paneldeki anahtarlar durumu zaten hemen günceller)
        const lastRefresh = useRef(0);
        const refreshSoon = () => {
          if (Date.now() - lastRefresh.current < 30000) return;
          lastRefresh.current = Date.now();
          refresh();
        };
        useEffect(() => { refreshSoon(); }, []);
        useEffect(() => { if (open) refreshSoon(); }, [open]);
        useEffect(() => {
          const f = () => setSt(x => ({ ...x, theme: window.llTheme?.get() ?? 'dark', dnd: load('ll.dnd', false) }));
          window.addEventListener('storage', f);
          return () => window.removeEventListener('storage', f);
        }, []);

        // Where each switch's state is read back (one source per state the hardware or the core owns)
        const radios = () => qs('radios').then(s => { const r = json(s); return r ? { radios: r } : null; });
        const SOURCES = {
          wifi: radios, bluetooth: radios,
          ethernet: () => qs('eth').then(s => { const r = json(s); return r ? { eth: r } : null; }),
          mic: () => helper(['--mic', 'status']).then(s => { const r = json(s); return r ? { mic: !r.muted } : null; }),
          nightLight: () => helper(['--nightlight', 'status']).then(s => { const r = json(s); return r ? { night: r } : null; }),
          idleInhibitor: () => qs('status').then(s => { const r = json(s); return r ? { awake: !!r.awake } : null; }),
        };
        // A switch: its request, then its check (checkSwitch). The tile ends on what the source says; a failed switch
        // gets a card (with what would repair it, if the request knows).
        const switchTile = (tile, want, request) => (async () => {
          let hint = null;
          try { hint = await request(); } catch {}
          const r = await checkSwitch({ tile, want, read: SOURCES[tile], apply: part => setSt(x => ({ ...x, ...part })) });
          if (r.ok) return;
          if (!r.answered) refresh();
          const d = defs[tile];
          emit('ll:toast', { kind: 'error', title: d?.name || tile, body: hint || 'Açılıp kapatılamadı.', icon: d?.icon || 'error' }).catch(() => {});
        })();

        const out = o.audio?.defaultPlaybackDevice;
        const ssid = o.network?.defaultGateway?.ssid || null;
        const wifiOn = st.radios.wifi === 'On';
        const eth = st.eth;
        const toggleMenu = type => setMenu(m => (m === type ? null : type));

        const defs = {
          wifi: {
            name: 'Wi-Fi', alt: true, hidden: !st.radios.wifi, // adaptör yoksa hiç gösterme
            icon: !wifiOn ? 'wifi_off' : ssid ? 'wifi' : 'wifi_find', toggled: wifiOn,
            status: !wifiOn ? 'Kapalı' : ssid || 'Bağlı değil',
            action: () => {
              const next = wifiOn ? 'Off' : 'On';
              setSt(x => ({ ...x, radios: { ...x.radios, wifi: next } }));
              switchTile('wifi', next === 'On', () => qs(`radio?kind=wifi&state=${next}`).then(() => null));
            },
            menu: () => toggleMenu('wifi'),
          },
          ethernet: {
            // kablo takılı değilse gösterme; ama devre dışı bırakıldıysa göster ki geri açılabilsin
            name: 'Ethernet', alt: true, hidden: !eth || eth.state === 'none' || eth.state === 'disconnected',
            icon: eth?.state === 'disabled' ? 'settings_ethernet' : 'lan', toggled: eth?.state === 'up',
            status: eth?.state === 'disabled' ? 'Devre dışı' : eth?.speed ? `Bağlı · ${eth.speed}` : 'Bağlı',
            action: () => {
              const on = eth?.state === 'disabled';
              setSt(x => ({ ...x, eth: { ...x.eth, state: on ? 'up' : 'disabled' } }));
              // the core's admin task for it is missing: the installer repairs it
              switchTile('ethernet', on, () => qs('eth-toggle').then(s => json(s)?.needSetup
