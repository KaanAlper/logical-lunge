<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <script>
// Logical Lunge dil katmanı: arayüz Türkçe yazılır; sistem dili Türkçe değilse ekrandaki metinler,
// title ve placeholder'lar i18n.json'dan çevrilir (13 dil; olmayan dil İngilizceye düşer, Arapça sağdan sola).
// Tarih/ay/gün adları window.LL_LOCALE ile (Intl) aynı dilde. Yeni dil / metin: i18n.src.js.
// Kurulumda seçilen dil ve saat prefs.json'da ({"language": "system" | "tr" | "en" ..., "clock": "24" | "12"}):
// dil "system" değilse sistem dilinin yerine geçer; window.LL_HOUR12 saatlerin 12 saatlik (AM/PM) çizilmesi içindir.
(function () {
  var prefs = {};
  try {
    var px = new XMLHttpRequest(); px.open('GET', './prefs.json', false); px.send();
    if (px.status === 200) prefs = JSON.parse(px.responseText) || {};
  } catch (e) {}
  window.LL_PREFS = prefs;
  window.LL_HOUR12 = prefs.clock === '12';
  var lang = prefs.language && prefs.language !== 'system' ? prefs.language
    : (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
  window.LL_LOCALE = lang;
  var code = lang.slice(0, 2).toLowerCase();
  window.LL_T = function (s) { return s; };
  if (code === 'tr') return;
  var data = null;
  try {
    // Sayfa çizilmeden önce hazır olsun diye eşzamanlı (yerel kabuk sunucusundan, ~1 ms)
    var x = new XMLHttpRequest(); x.open('GET', './i18n.json', false); x.send();
    if (x.status === 200) data = JSON.parse(x.responseText);
  } catch (e) {}
  if (!data) return;
  if (data.langs.indexOf(code) < 0) code = 'en';
  if (code === 'ar') document.documentElement.dir = 'rtl';
  document.documentElement.lang = code;
  var vals = data[code], dict = {}, pats = [];
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  data.keys.forEach(function (k, i) {
    if (/\$\d/.test(k)) {
      // "$1 zaten "$2" için..." -> (.+?) grupları; hangi grubun $kaç olduğunu sırayla tut
      var order = (k.match(/\$\d/g) || []).map(function (x) { return +x.charAt(1); });
      pats.push([new RegExp('^' + esc(k).replace(/\\\$\d/g, '(.+?)') + '$'), vals[i], order]);
    }
    else dict[k] = vals[i];
  });
  // Başı sabit metinle başlayan desenler önce: "Açık · 20:00 sonrası" -> Açık · (20:00 sonrası)
  pats.sort(function (a, b) { return (a[0].source.indexOf('^(') === 0) - (b[0].source.indexOf('^(') === 0); });
  function T(s) {
    if (!s) return s;
    var k = s.trim();
    if (!k || !/[A-Za-zÇĞİÖŞÜçğıöşü]/.test(k)) return s;
    var v = dict[k];
    if (v === undefined) {
      for (var i = 0; i < pats.length; i++) {
        var m = k.match(pats[i][0]);
        if (m) {
          v = pats[i][1];
          for (var j = 0; j < pats[i][2].length; j++) v = v.replace('$' + pats[i][2][j], T(m[j + 1])); // iç içe: "Açık · 20:00 sonrası"
          break;
        }
      }
    }
    return v === undefined ? s : s.replace(k, v);
  }
  window.LL_T = T;
  function fixNode(n) {
    if (n.nodeType === 3) { var t = T(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; return; }
    if (n.nodeType !== 1) return;
    if (n.classList && n.classList.contains('icon')) return; // ikon adları (Material Symbols ligatürleri)
    ['title', 'placeholder', 'aria-label'].forEach(function (a) {
      var v = n.getAttribute && n.getAttribute(a);
      if (v) { var t = T(v); if (t !== v) n.setAttribute(a, t); }
    });
    for (var c = n.firstChild; c; c = c.nextSibling) fixNode(c);
  }
  new MutationObserver(function (list) {
    for (var i = 0; i < list.length; i++) {
      var m = list[i];
      if (m.type === 'characterData') {
        var p = m.target.parentNode;
        if (!(p && p.classList && p.classList.contains('icon'))) fixNode(m.target);
      } else if (m.type === 'attributes') fixNode(m.target);
      else for (var j = 0; j < m.addedNodes.length; j++) {
        var a = m.addedNodes[j], par = a.parentNode;
        if (a.nodeType === 3 && par && par.classList && par.classList.contains('icon')) continue;
        fixNode(a);
      }
    }
  }).observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['title', 'placeholder', 'aria-label'] });
})();
    </script>
    <script>
// Logical Lunge kabuk teması (ii'deki karanlık/aydınlık düğmesi). Windows temasına dokunmaz:
// tercih localStorage 'll.theme' ('dark' | 'light'); tüm widget'lar aynı kaynaktan yüklendiği için
// bir widget değiştirince diğerleri 'storage' olayıyla anında güncellenir.
(function () {
  function read() {
    try { return localStorage.getItem('ll.theme') === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; }
  }
  function apply() { document.documentElement.dataset.theme = read(); }
  apply();
  window.addEventListener('storage', function (e) { if (e.key === 'll.theme') apply(); });
  window.llTheme = {
    get: read,
    toggle: function () {
      var next = read() === 'light' ? 'dark' : 'light';
      try { localStorage.setItem('ll.theme', next); } catch (e) {}
      apply();
      return next;
    }
  };
})();
    </script>
    <!-- ii modules/ii/notificationPopup karşılığı: sağ üstte, bar'ın altında kayarak gelen kartlar.
         Pencere odak çalmaz: hep açık ama boşken fare tıklamalarını geçirir. -->
    <style>
      @import url('./fonts.css');
      :root {
        --m3primary: #d0bcff; --m3onPrimary: #381e72;
        --m3primaryContainer: #4f378b; --m3onPrimaryContainer: #eaddff;
        --m3secondaryContainer: #4a4458; --m3onSecondaryContainer: #e8def8;
        --m3error: #ffb4ab; --m3errorContainer: #93000a; --m3onErrorContainer: #ffdad6;
        --m3onSurface: #e6e0e9; --m3onSurfaceVariant: #cac4d0; --m3outline: #938f99;
        --colLayer0: #141218; --colLayer0Border: #2c2a31; --colLayer2: #2b2930;
        --emphDecel: cubic-bezier(0.05, 0.7, 0.1, 1);
        --emphAccel: cubic-bezier(0.3, 0, 0.8, 0.15);
        --expressiveSpatial: cubic-bezier(0.38, 1.21, 0.22, 1); /* ii expressiveDefaultSpatial: hafif esneyip oturan giriş */
      }
      /* ---- Açık tema (ii: appearance dark mode kapalı) — Material You açık, mor tohum.
         Tema düğmesi yalnızca bizim kabuğu değiştirir (Windows'a dokunmaz): tercih localStorage 'll.theme'da, <html data-theme> ile uygulanır. ---- */
      :root[data-theme="light"] {
          --m3primary: #6750a4;
          --m3onPrimary: #ffffff;
          --m3primaryContainer: #eaddff;
          --m3onPrimaryContainer: #21005d;
          --m3secondaryContainer: #e8def8;
          --m3onSecondaryContainer: #1d192b;
          --m3onSurface: #1d1b20;
          --m3onSurfaceVariant: #49454f;
          --m3outline: #79747e;
          --m3outlineVariant: #cac4d0;
          --m3error: #b3261e;
          --m3errorContainer: #f9dedc;
          --m3onErrorContainer: #410e0b;
          --colLayer0: #fef7ff;
          --colLayer0Border: #e6e0e9;
          --colLayer1: #f3edf7;
          --colLayer1Hover: #e6e0e9;
          --colLayer2: #ece6f0;
          --colLayer2Hover: #e0dae4;
          --colBackgroundSurfaceContainer: #f3edf7;
          --colSurfaceContainerHigh: #ece6f0;
          --colOnLayer0: #1d1b20;
          --colOnLayer1: #1d1b20;
          --colSubtext: #79747e;
          --colOnLayer1Inactive: #9e98a3;
          --occupied: rgba(232 222 248 / 90%);
        }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
      body {
        font-family: 'Google Sans Flex', 'Rubik', 'Segoe UI Variable Text', sans-serif;
        font-variation-settings: 'wght' 450; color: var(--m3onSurface);
        -webkit-font-smoothing: antialiased;
      }
      .icon { font-family: 'Material Symbols Rounded'; line-height: 1; font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      #stack { display: flex; flex-direction: column; gap: 8px; padding: 10px; }

      .card {
        position: relative; overflow: hidden;
        display: flex; gap: 12px; align-items: flex-start;
        padding: 12px 14px 12px 12px;
        border-radius: 17px;                           /* rounding.normal */
        background: var(--colLayer0);
        border: 1px solid var(--colLayer0Border);
        box-shadow: 0 2px 10px rgba(0 0 0 / 40%);
        cursor: pointer;
        animation: cardIn 500ms var(--expressiveSpatial) both;
      }
      .card.out { animation: cardOut 220ms var(--emphAccel) both; }
      @keyframes cardIn { from { transform: translateX(110%); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes cardOut { to { transform: translateX(110%); opacity: 0; } }

      .badge {
        width: 42px; height: 42px; flex: none; border-radius: 999px;
        display: flex; align-items: center; justify-content: center;
        background: var(--m3secondaryContainer); color: var(--m3onSecondaryContainer);
      }
      .badge .icon { font-size: 22px; }
      .card.error .badge { background: var(--m3errorContainer); color: var(--m3onErrorContainer); }
      .card.ok .badge { background: var(--m3primaryContainer); color: var(--m3onPrimaryContainer); }
      .card.error .badge { animation: wiggle 420ms 200ms ease-in-out; }
      @keyframes wiggle { 25% { transform: rotate(-12deg); } 50% { transform: rotate(10deg); } 75% { transform: rotate(-5deg); } }

      .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
      .head { display: flex; align-items: baseline; gap: 8px; }
      .title { flex: 1; font-size: 15px; font-variation-settings: 'wght' 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .time { font-size: 12px; color: var(--m3outline); }
      .body {
        font-size: 13px; color: var(--m3onSurfaceVariant); line-height: 1.35;
        white-space: pre-wrap; word-break: break-word;
        max-height: 150px; overflow: hidden;
      }
      .body.mono { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 12px; }
      /* kalan süre çubuğu */
      .timer { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--m3primary); opacity: 0.6; }
      .card.error .timer { background: var(--m3error); }
      .badge.art { object-fit: cover; border-radius: 12px; width: 52px; height: 52px; }
      .acts { display: flex; gap: 6px; margin-top: 6px; }
      .acts button {
        border: 0; padding: 7px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13px;
        background: var(--m3secondaryContainer); color: var(--m3onSecondaryContainer);
        transition: border-radius 200ms var(--emphDecel), filter 150ms;
      }
      .acts button:first-child { background: var(--m3primary); color: var(--m3onPrimary); }
      .acts button:hover { filter: brightness(1.1); border-radius: 10px; }
    </style>
  </head>
  <body>
    <div id="stack"></div>
    <script type="module">
      import * as lunge from 'lunge/shell';
      import { listen, emit } from '@tauri-apps/api/event';
      import { LogicalSize, PhysicalPosition } from '@tauri-apps/api/dpi';

      const win = lunge.currentWidget().tauriWindow;
      const W = 420, TIMEOUT = 6000; // ii notifications.timeout
      const stack = document.getElementById('stack');
      let cards = 0;

      // Boşken pencere gerçekten gizlenir: saydam da olsa açık kalan pencere oyunun üstünde her karede birleştiriliyor
      // ve içinde kalan animasyonlar çizilmeye devam ediyordu. Odak çalmadan çekirdek gösterir / gizler (tam ekran oyunda
      // bildirimi oyun bitince gösterir); çekirdeğe ulaşılamazsa Tauri.
      // İstekler sırayla gider (ters sırada işlenen iki istek pencereyi yanlış durumda bırakıyordu); sırada beklerken
      // durum yine değiştiyse eskisi atlanır. Gösterirken önce sayfa görünür yapılır (ilk kare hazır olsun). Gizlerken
      // çekirdeğe bildirilir (oyun sonrasına bekleyen gösterme iptal olur), pencere Tauri ile de gizlenir (pencere
      // kütüphanesi kendi kaydında görünür sanıp sonraki stil değişikliğinde yeniden gösteriyordu), sonra sayfa
      // görünmez olur (çizim durur).
      let shownState = null, shownQueue = Promise.resolve();
      const coreShow = v => fetch(`http://127.0.0.1:6131/widget?w=toast&v=${v ? 1 : 0}`, { method: 'POST', cache: 'no-store' })
        .then(r => { if (!r.ok) throw new Error(String(r.status)); });
      const setShown = v => {
        if (shownState === v) return;
        shownState = v;
        shownQueue = shownQueue.then(async () => {
          if (shownState !== v) return;
          if (v) {
            await lunge.setWebviewVisible(true);
            await coreShow(true).catch(() => win.show());
          } else {
            await coreShow(false).catch(() => {});
            await win.hide();
            if (shownState === false) await lunge.setWebviewVisible(false);
          }
        }).catch(() => {});
      };

      async function fit() {
        const h = cards ? stack.getBoundingClientRect().height : 1;
        try {
          await win.setSize(new LogicalSize(W, Math.max(1, Math.ceil(h))));
          await win.setIgnoreCursorEvents(cards === 0);
        } catch (e) { console.error(e); }
        setShown(cards > 0);
      }
      fit();
      // Sayfa görünmezken (pencere gizliyken) kare gelmez, requestAnimationFrame hiç çalışmaz: ölçüm hemen yapılır
      // (yerleşim zaten eşzamanlı hesaplanır); görünürken bir sonraki karede.
      const fitSoon = () => (document.visibilityState === 'hidden' ? fit() : requestAnimationFrame(fit));

      function esc(s) { return String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]); }

      // actions: [{ label, url }] -> ii notify-send -A düğmeleri; image: kapak görseli (rozet yerine)
      const openUrl = url => lunge.shellExec('{{INSTALL_ESC}}\\lunge.exe', ['--open', url]).catch(() => {});
      function show({ kind = 'info', title = '', body = '', icon = 'info', mono = false, actions = [], image = '', timeout = TIMEOUT }) {
        // ii Notifications.silent: sessiz moddayken açılır bildirim gösterme
        try { if (JSON.parse(localStorage.getItem('ll.dnd')) === true) return; } catch {}
        const el = document.createElement('div');
        el.className = `card ${kind}`;
        const now = new Date().toLocaleTimeString(window.LL_LOCALE, { hour: '2-digit', minute: '2-digit', hour12: window.LL_HOUR12 });
        el.innerHTML = `
          ${image ? `<img class="badge art" src="${esc(image)}" alt="">` : `<div class="badge"><span class="icon">${esc(icon)}</span></div>`}
          <div class="txt">
            <div class="head"><span class="title">${esc(title)}</span><span class="time">${now}</span></div>
            ${body ? `<div class="body ${mono ? 'mono' : ''}">${esc(body)}</div>` : ''}
            ${actions.length ? `<div class="acts">${actions.map((a, i) => `<button data-i="${i}">${esc(a.label)}</button>`).join('')}</div>` : ''}
          </div>
          <div class="timer"></div>`;
        stack.prepend(el);
        cards++;
        const timer = el.querySelector('.timer');
        timer.animate([{ width: '100%' }, { width: '0%' }], { duration: timeout, easing: 'linear', fill: 'forwards' });
        el.querySelectorAll('.acts button').forEach(b => b.addEventListener('click', ev => {
          ev.stopPropagation();
          const a = actions[+b.dataset.i];
          if (a?.url) openUrl(a.url);
          close();
        }));

        let gone = false;
        const close = () => {
          if (gone) return; gone = true;
          el.classList.add('out');
          el.addEventListener('animationend', () => { el.remove(); cards--; fit(); }, { once: true });
        };
        let t = setTimeout(close, timeout);
        // Üzerine gelince bekle (ii'de de fareyle durur)
        el.addEventListener('mouseenter', () => { clearTimeout(t); timer.getAnimations().forEach(a => a.pause()); });
        el.addEventListener('mouseleave', () => { t = setTimeout(close, 2000); timer.getAnimations().forEach(a => a.play()); });
        el.addEventListener('click', close);
        fitSoon();
      }

      listen('ll:toast', e => show(e.payload || {}));

      // Güncelleme kartı (ayrı pencere, aynı köşe) açıkken bildirimler onun altına dizilir; iki pencere üst üste biniyordu.
      // Kart yüksekliğini yayınlar; aradaki boşluk kartlar arasındakiyle aynı olsun diye iki pencerenin dolgusu (10+10)
      // çıkarılıp 8 eklenir.
      let baseY = null, updateH = 0;
      async function place() {
        try {
          const pos = await win.outerPosition();
          if (baseY === null) baseY = pos.y;
          const off = updateH > 0 ? Math.round((updateH - 12) * (await win.scaleFactor())) : 0;
          if (pos.y !== baseY + off) await win.setPosition(new PhysicalPosition(pos.x, baseY + off));
        } catch (e) { console.error(e); }
      }
      listen('ll:update-card', e => { updateH = Math.max(0, e.payload?.height || 0); place(); });
      emit('ll:update-card-query').catch(() => {});

      // Çekirdekten gelen bildirimler (yakalanan Windows hata pencereleri, açılamayan uygulamalar).
      // Helper'ın akış modu stdout'a satır satır JSON yazar; süreç biterse 3 sn sonra yeniden başlat.
      const HELPER = '{{INSTALL_ESC}}\\lunge.exe';
      async function stream() {
        try {
          const p = await lunge.shellSpawn(HELPER, ['--toast-stream']);
          let buf = '';
          p.onStdout(chunk => {
            buf += chunk;
            const lines = buf.split(/\r?\n/);
            buf = lines.pop();
            for (const l of lines) { if (l.trim()) { try { show(JSON.parse(l)); } catch {} } }
          });
          p.onExit(() => setTimeout(stream, 3000));
        } catch (e) {
          console.error('toast stream', e);
          setTimeout(stream, 3000);
        }
      }
      stream();
    </script>
  </body>
</html>
